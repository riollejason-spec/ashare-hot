<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SRC_COLORS={'财联社':'#f0524f','新浪财经':'#e3b341','华尔街见闻':'#4493f8','证券时报':'#a371f7','东方财富':'#39c5e6','中国人民银行':'#ff4f8b','中国政府网':'#ff7b72'};
const srcColor=n=>{for(const k in SRC_COLORS){if(n.indexOf(k)>=0)return SRC_COLORS[k]}return '#8b949e'};
const SENT={bull:['利好','up'],bear:['利空','down'],mixed:['多空交织','flat']};

function load(){
  return fetch('data/latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})
   .catch(()=>JSON.parse(document.getElementById('embedded').textContent));
}
function fmtNum(n){return Math.round(n).toLocaleString('en-US')}
function countUp(el,to,ms){
  const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=fmtNum(to*e);if(p<1)requestAnimationFrame(f)})(t0);
}
function render(d){
  const C=d.counters||{};
  const stats=[['新闻源',C.sources],['抓取条数',C.raw],['去重事件',C.events],['读取字数',C.chars],['入选 TOP20',C.top]];
  $('#stats').innerHTML=stats.map(s=>'<div class="stat"><div class="lbl">'+esc(s[0])+'</div><div class="num" data-to="'+(+s[1]||0)+'">0</div></div>').join('');
  document.querySelectorAll('.stat .num').forEach((el,i)=>setTimeout(()=>countUp(el,+el.dataset.to,1400+i*150),150*i));
  const ws=d.window.start||'',we=d.window.end||'';const weS=ws.slice(0,10)===we.slice(0,10)?we.slice(11):we;
  $('#meta').textContent='窗口 '+ws+' → '+weS+' 北京时间 · 生成 '+(d.generated||'').slice(5);
  $('#mood').textContent=d.mood||'';
  $('#strip').innerHTML=(d.snapshot||[]).map(s=>{
    const c=s.chg_pct, cls=c>0?'up':c<0?'down':'flat';
    const v=s.last>=1000?s.last.toLocaleString('en-US',{maximumFractionDigits:2}):(+s.last).toFixed(s.last<20?4:2);
    return '<div class="tick"><div class="n">'+esc(s.label)+'</div><div class="v">'+esc(v)+'</div><div class="c '+cls+'">'+(c==null?'—':(c>0?'+':'')+c.toFixed(2)+'%')+'</div></div>'}).join('');
  $('#snapt').textContent=d.snapshot_time?('行情快照 '+d.snapshot_time+' 北京时间（来源：新浪财经行情）'):'';
  $('#sub').textContent='从 '+fmtNum(C.events||0)+' 个去重事件中按影响力、意外性、时效、权威性筛选';
  const items=d.items||[];
  $('#list').innerHTML=items.map((it,i)=>{
    const s=SENT[it.sentiment]||SENT.mixed;
    const link=(it.sources||[]).find(x=>x.url);
    const kws=[].concat(it.bull||[],it.bear||[]);
    const why=wrapKw(esc(it.why),it);
    const groups=[];(it.sources||[]).forEach(x=>{let g=groups.find(g=>g.name===x.name);if(!g){g={name:x.name,urls:[]};groups.push(g)}if(x.url)g.urls.push(x.url)});
    const A=(u,t)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+t+'</a>';
    const tags=groups.map(g=>'<span class="tg src"><i style="background:'+srcColor(g.name)+'"></i>'+(g.urls.length?A(g.urls[0],esc(g.name)):esc(g.name))
        +(g.urls.length>1?g.urls.slice(1).map((u,k)=>' '+A(u,'<sup>'+(k+2)+'</sup>')).join(''):'')+'</span>').join('')
      +(it.bull||[]).map(t=>'<span class="tg bull">利好·'+esc(t)+'</span>').join('')
      +(it.bear||[]).map(t=>'<span class="tg bear">利空·'+esc(t)+'</span>').join('');
    return '<li class="row" data-s="'+esc(it.sentiment)+'" style="animation-delay:'+(0.25+i*0.05)+'s">'
      +'<div class="main"><div class="ttl"><span class="ic"></span>'+(link?'<a href="'+esc(link.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>':esc(it.title))+'</div>'
      +'<div class="why">'+why+'</div><div class="imp">'+esc(it.impact)+'</div><div class="tags">'+tags+'</div></div>'
      +'<div class="side"><span class="badge'+(it.rank<=3?' top3':'')+'">#'+it.rank+'</span><span class="senti '+s[1]+'">'+s[0]+'</span></div></li>'}).join('');
  $('#tabsp').textContent=items.length+' items';
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    const f=t.dataset.f;document.querySelectorAll('.row').forEach(r=>r.classList.toggle('hide',f!=='all'&&r.dataset.s!==f));
    setTimeout(layoutNet,30);
  });
  document.querySelectorAll('.row').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('a'))return;r.classList.toggle('open');setTimeout(layoutNet,30)}));
  const q=$('#q');q.oninput=()=>{const v=q.value.trim().toLowerCase();document.querySelectorAll('.row').forEach(r=>r.classList.toggle('hide',!!v&&r.textContent.toLowerCase().indexOf(v)<0));setTimeout(layoutNet,30)};
  addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
  const st=d.source_status||[];
  $('#foot').innerHTML=(d.trading_note?'<div>📅 '+esc(d.trading_note)+'</div>':'')
    +'<div class="srcs">'+st.map(s=>'<span class="'+(s.ok?'down':'up')+'">'+(s.ok?'●':'○')+' '+esc(s.name)+' '+(s.ok?s.n:'失败')+'</span>').join('')+'</div>'
    +'<div class="disc">'+esc(d.disclaimer)+'</div>';
  initNet(items);flicker();
}
// wrap keywords (numbers/percent and a few domain words) in spans for the flicker effect
function wrapKw(html,it){
  const words=['央行','油价','布伦特','加息','光模块','光芯片','固态电池','华虹','广汽','VLCC','风电','外资','券商','台积电','厄尔尼诺','量子','橡胶','跌停','涨停','新高','扭亏','预增'];
  let out=html.replace(/(\d+(?:\.\d+)?(?:%|亿元|亿|万吨|美元))/g,'<span class="kw">$1</span>');
  words.forEach(w=>{out=out.replace(new RegExp('(^|[^>])('+w+')(?![^<]*<\\/span>)'),'$1<span class="kw">$2</span>')});
  return out;
}
function flicker(){
  const kws=[...document.querySelectorAll('.kw')];if(!kws.length)return;
  const cls=['h1','h2','h3','h4'];
  setInterval(()=>{
    for(let k=0;k<3;k++){const el=kws[Math.random()*kws.length|0],c=cls[Math.random()*4|0];
      el.classList.add(c);setTimeout(()=>el.classList.remove(c),500+Math.random()*900);}
  },650);
}
// network overlay: source nodes drift and link to the rows they support
let NET=null;
function initNet(items){
  const cv=$('#net'),ctx=cv.getContext('2d');
  const names=[...new Set(items.flatMap(it=>(it.sources||[]).map(s=>s.name.replace(/（.*$/,''))))];
  const nodes=names.map((n,i)=>({name:n,color:srcColor(n),ax:0.45+0.4*Math.random(),ay:(i+0.5)/names.length,ph:Math.random()*6.28}));
  const LABELS=['crawl','dedupe','rank','parse','利好','利空','agents.','fetch','merge'];
  NET={cv,ctx,nodes,items,rows:[],labels:LABELS.map(t=>({t,n:Math.random()*nodes.length|0,life:0}))};
  layoutNet();addEventListener('resize',layoutNet);
  requestAnimationFrame(drawNet);
}
function layoutNet(){
  if(!NET)return;const {cv}=NET,p=$('#panel'),dpr=Math.min(2,devicePixelRatio||1);
  const W=p.clientWidth,H=p.clientHeight;cv.width=W*dpr;cv.height=H*dpr;NET.ctx.setTransform(dpr,0,0,dpr,0,0);NET.W=W;NET.H=H;
  const pr=p.getBoundingClientRect();
  NET.rows=[...document.querySelectorAll('.row')].map((r,i)=>{if(r.classList.contains('hide'))return null;const b=r.querySelector('.badge').getBoundingClientRect();
    return {x:b.left-pr.left-6,y:b.top-pr.top+b.height/2,srcs:(NET.items[i].sources||[]).map(s=>s.name.replace(/（.*$/,''))}}).filter(Boolean);
}
function drawNet(t){
  const {ctx,nodes,rows,W,H}=NET;ctx.clearRect(0,0,W,H);
  const narrow=W<640;
  nodes.forEach((n,i)=>{n.x=narrow?W-34+8*Math.sin(t/3000+n.ph):W*(n.ax+0.05*Math.sin(t/6000+n.ph));n.y=H*(0.06+0.9*n.ay)+18*Math.sin(t/4000+n.ph*2)});
  ctx.lineWidth=1;
  rows.forEach((r,ri)=>{r.srcs.forEach(sn=>{const n=nodes.find(x=>x.name===sn);if(!n)return;
    if(Math.abs(n.y-r.y)>H*0.35)return; // keep the web local, like the video
    ctx.strokeStyle='rgba(57,197,230,'+(narrow?0.18:0.3)+')';ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(r.x,r.y);ctx.stroke();
    const p=((t/2200)+ri*0.13)%1;ctx.fillStyle='rgba(57,197,230,0.75)';ctx.beginPath();ctx.arc(n.x+(r.x-n.x)*p,n.y+(r.y-n.y)*p,1.6,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(255,79,139,0.75)';ctx.beginPath();ctx.arc(r.x,r.y,2.4,0,6.28);ctx.fill();})});
  ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
  nodes.forEach(n=>{ctx.fillStyle=n.color;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(n.x,n.y,3.4,0,6.28);ctx.fill();
    ctx.strokeStyle=n.color;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(n.x,n.y,7+2*Math.sin(t/500+n.ph),0,6.28);ctx.stroke();ctx.globalAlpha=1});
  NET.labels.forEach(l=>{l.life-=1;if(l.life<=0){if(Math.random()<0.01){l.life=60+Math.random()*80;l.n=Math.random()*nodes.length|0}return}
    const n=nodes[l.n];if(!n)return;ctx.globalAlpha=Math.min(1,l.life/20)*0.9;ctx.strokeStyle='#39c5e6';ctx.fillStyle='rgba(7,9,13,.85)';
    const w=ctx.measureText(l.t).width+8,lx=(n.x+8+w>W-4)?n.x-8-w:n.x+8;ctx.fillRect(lx,n.y-16,w,14);ctx.strokeRect(lx,n.y-16,w,14);ctx.fillStyle='#bfefff';ctx.fillText(l.t,lx+4,n.y-5.5);ctx.globalAlpha=1});
  requestAnimationFrame(drawNet);
}
load().then(render).then(()=>setTimeout(layoutNet,1200));
})();
</script>
