<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:,">
<title>A股每日看板</title>
<style>
:root{--bg:#07090d;--panel:#0d1117;--panel2:#11161d;--line:#232a33;--text:#d6dde6;--dim:#7d8590;
--blue:#4493f8;--cyan:#39c5e6;--pink:#ff4f8b;--yellow:#e3b341;--up:#f0524f;--down:#2fbf71;
--mono:ui-monospace,"SF Mono",Menlo,"JetBrains Mono","Geist Mono","DejaVu Sans Mono",monospace;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#0f1a2a 0%,transparent 60%),var(--bg);min-height:100vh}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 40px}
/* top nav */
nav.top{position:sticky;top:0;z-index:20;background:rgba(7,9,13,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -14px;padding:max(8px,env(safe-area-inset-top)) 14px 0}
.navin{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.nt{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px 10px;font-size:14px;color:var(--dim);cursor:pointer;white-space:nowrap;position:relative}
.nt.on{color:#f0f6fc;border-bottom-color:var(--pink)}
.nt .pd{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:2px;background:#30363d}
.nt .pd.ok{background:var(--down);box-shadow:0 0 6px var(--down)}
.nt .pd.ex{background:var(--yellow)}
/* stat counters */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 4px 16px;border-bottom:1px solid var(--line)}
.stat .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .num{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;margin-top:4px;color:#e6edf3;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat:nth-child(1) .num{color:var(--cyan)} .stat:nth-child(5) .num{color:var(--pink)}
.stat .num.up{color:var(--up)!important} .stat .num.down{color:var(--down)!important}
/* header */
header{padding:16px 4px 4px}
h1{margin:0;font-size:24px;letter-spacing:.02em;color:#f0f6fc}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pink);margin-right:8px;vertical-align:middle;box-shadow:0 0 10px var(--pink);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:6px}
.mood{margin:12px 0 4px;padding:10px 12px;border-left:3px solid var(--cyan);background:#0b131c;font-size:14px;line-height:1.65;border-radius:0 6px 6px 0}
.mood:empty{display:none}
.note{margin:10px 0 0;padding:8px 12px;border:1px dashed #6e5a1f;background:#1a1508;color:var(--yellow);font-size:12.5px;border-radius:6px;line-height:1.55}
.exb{margin:12px 0 0;padding:10px 12px;border:1px solid #7a5d12;background:repeating-linear-gradient(135deg,#2a2006 0 12px,#211903 12px 24px);color:#ffd866;font-size:13px;font-weight:600;border-radius:8px;letter-spacing:.04em}
.exb small{display:block;font-weight:400;color:#d9c48a;margin-top:3px;letter-spacing:0}
.ban{margin:12px 16px 0;padding:9px 12px;border:1px solid #5b3a8a;background:#160f26;color:#d8c4ff;font-size:13px;line-height:1.55;border-radius:8px;position:relative;z-index:2}
.ttc{margin:12px 16px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 12px;position:relative;z-index:2;font-size:12.5px}
.ttc summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;color:var(--dim);list-style:none} .ttc summary::-webkit-details-marker{display:none}
.ttc summary b{color:#e6edf3;font-weight:600} .ttc table{width:100%;border-collapse:collapse;margin-top:6px}
.ttc td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top;line-height:1.5;color:#c9d1d9} .ttc td.tm{font-family:var(--mono);white-space:nowrap;padding-right:12px;color:var(--cyan);width:1%}
.ttc tr.paused td{color:var(--dim)} .ttc tr.paused td.tm{text-decoration:line-through;color:var(--dim)}
.ttc .pz{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:#3a2a10;color:var(--yellow);margin-left:4px} .ttc small{display:block;color:var(--dim);font-size:11.5px}
.erule{margin:10px 16px 0;padding:8px 12px;border-left:3px solid var(--cyan);background:#0b131c;font-size:12.5px;line-height:1.6;color:#c9d1d9;border-radius:0 6px 6px 0;position:relative;z-index:2}
.erule b{color:var(--cyan);font-weight:600;margin-right:4px}
.ledg{margin:10px 16px 0;padding:8px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;font-size:12px;line-height:1.7;color:var(--dim);position:relative;z-index:2;overflow-wrap:anywhere}
.ledg code{font-family:var(--mono);color:#e6edf3} .ledg .ok{color:var(--down)} .ledg .warn{color:var(--yellow)}
.refl{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.55} .refl b{font-weight:500;color:#aeb7c2}
.px.pend{font-family:var(--sans);font-size:12px;color:var(--yellow);white-space:normal;text-align:right;max-width:80px;line-height:1.3}
.stb{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;margin-right:8px;vertical-align:1px}
.stb.ok{background:#0d1a13;border:1px solid #1f4a33;color:var(--down)} .stb.bad{background:#2a0f12;border:1px solid #7a2a2e;color:var(--up)}
.invalid{margin:12px 16px 0;padding:10px 12px;border:1px solid #7a2a2e;background:#1d0b0d;color:#ffb3b5;font-size:13px;line-height:1.6;border-radius:8px;position:relative;z-index:2}
.invalid b{color:var(--up)}
.bases{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.base{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#0d1117;min-width:0}
.base.main{border-color:#3d2f63;background:#120d1f} .base .bl{font-size:11.5px;color:var(--dim);line-height:1.4}
.base .bv{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:3px} .base .bv.pend{font-family:var(--sans);font-size:13px;color:var(--yellow);font-weight:500}
.base .bs{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.flag{display:inline-block;font-size:10.5px;padding:1px 5px;border-radius:4px;margin-left:4px;white-space:nowrap}
.flag.uf{border:1px solid #6e5a1f;color:var(--yellow);background:#1a1508} .flag.rl{border:1px solid #1f4a33;color:var(--down);background:#0d1a13}
.note1{margin:10px 16px 0;font-size:12px;color:var(--yellow);position:relative;z-index:2}
.rej{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:12.5px;position:relative;z-index:2}
.rej td{padding:6px 6px;border-bottom:1px solid #1a2028;vertical-align:top} .rej td:first-child{font-family:var(--mono);color:var(--dim);white-space:nowrap}
.rej td:last-child{color:var(--yellow)}
.empty{padding:28px 18px 34px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7;position:relative;z-index:2}
.rawp,.rules{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;line-height:1.65}
.rawp{padding:10px 14px} .rawp h4{margin:0 0 6px;font-size:13.5px;color:#f0f6fc;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rawp .kv2{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;color:var(--dim)} .rawp .kv2 span:nth-child(even){color:#c9d1d9;font-family:var(--mono);overflow-wrap:anywhere;min-width:0}
.rules summary{cursor:pointer;padding:10px 14px;font-size:13.5px;color:#f0f6fc;list-style:none;user-select:none}
.rules summary::-webkit-details-marker{display:none} .rules summary::before{content:'▸ ';color:var(--cyan)} .rules[open] summary::before{content:'▾ '}
.rules .rb{padding:0 14px 12px;color:#aeb7c2} .rules h5{margin:10px 0 2px;font-size:12.5px;color:var(--cyan);font-weight:600} .rules ul{margin:2px 0 0;padding-left:18px} .rules li{margin:2px 0}
/* market strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip:empty{display:none}
.strip::-webkit-scrollbar{display:none}
.tick{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:96px}
.tick .n{font-size:11px;color:var(--dim)} .tick .v{font-family:var(--mono);font-size:14px;color:#e6edf3;margin-top:2px} .tick .c{font-family:var(--mono);font-size:12px;margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
.snapt{font-family:var(--mono);font-size:11px;color:var(--dim);padding:0 4px}
/* panel */
.panel{position:relative;margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.ptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ptop .ico{width:16px;height:16px;border-radius:50%;background:#e6edf3;flex:0 0 auto}
.ptop .t{font-size:14px;font-weight:600}
.ptop .search{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:150px;outline:none}
.ptop .search:focus{border-color:var(--blue)}
.phead{padding:16px 16px 10px} .phead h2{margin:0;font-size:22px;color:#f0f6fc} .phead p{margin:6px 0 0;color:var(--dim);font-size:13px}
.tabs{display:flex;align-items:center;gap:6px;margin:12px 16px 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);flex-wrap:wrap}
.tab{font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;user-select:none}
.tab.on{background:#1f6feb;color:#fff}
.tabs .sp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
ol.list{list-style:none;margin:12px 0 0;padding:0;position:relative;z-index:2}
.row{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);position:relative;opacity:0;transform:translateY(6px);animation:in .5s forwards}
@keyframes in{to{opacity:1;transform:none}}
.row.hide{display:none}
.row.flash{animation:in .5s forwards,fl 1.8s .1s}
@keyframes fl{0%,60%{background:#1f6feb33}100%{background:transparent}}
.main{flex:1;min-width:0}
.ttl{font-size:16px;font-weight:600;line-height:1.4}
.ttl .ic{display:inline-block;width:12px;height:12px;border:1.5px solid var(--dim);border-radius:2px;margin-right:6px;vertical-align:-1px}
.ttl .code{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--dim);margin-left:6px}
.why{color:#aeb7c2;font-size:13.5px;line-height:1.6;margin-top:5px}
.imp{color:var(--dim);font-size:12.5px;line-height:1.55;margin-top:4px}
.risk{color:#c9a65a;font-size:12.5px;line-height:1.55;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tg{font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text);white-space:nowrap;background:none}
.tg.src{color:var(--dim)} .tg.src i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tg.src a{color:inherit} .tg.src sup{color:var(--blue);font-size:10px}
.tg.bull{color:var(--up);border-color:#5a2526;background:#1d0f10}
.tg.bear{color:var(--down);border-color:#1f4a33;background:#0d1a13}
.tg.sec{color:#c9d1d9;border-color:#3b4350;background:#161b22}
.tg.hs{color:var(--cyan);border-color:#1d4a57;background:#0a1a20;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tg.hs:hover{border-color:var(--cyan)}
.tg.amt{font-family:var(--mono);color:var(--dim)}
.side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:64px}
.badge{font-family:var(--mono);font-size:12px;border:1px solid #30363d;background:#21262d;border-radius:6px;padding:4px 10px;color:#e6edf3;white-space:nowrap}
.badge.top3{border-color:#6e3b10;background:#2a1a08;color:var(--yellow)}
.senti{font-size:11px;font-family:var(--mono);white-space:nowrap}
.px{font-family:var(--mono);font-size:15px;color:#e6edf3;white-space:nowrap}
.chg{font-family:var(--mono);font-size:13px;white-space:nowrap}
.ov{font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid #5b3a8a;background:#1b1230;color:#c9a7ff;white-space:nowrap}
.sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
/* placeholder */
.ph{padding:44px 18px 52px;text-align:center;position:relative;z-index:2}
.ph-t{font-family:var(--mono);font-size:26px;color:#f0f6fc;letter-spacing:.04em}
.ph-s{color:var(--dim);font-size:13.5px;margin-top:10px;line-height:1.6}
.ph-c{font-family:var(--mono);font-size:14px;color:var(--cyan);margin-top:14px}
.ph-r{display:inline-block;margin-top:18px;font-size:12.5px;color:var(--blue);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:var(--panel2)}
/* review */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0;position:relative;z-index:2}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px}
.card .h{font-size:13px;color:var(--dim)} .card .h b{color:#e6edf3;font-weight:600}
.card .big{font-family:var(--mono);font-size:28px;font-weight:600;margin-top:4px}
.card .kv{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;color:var(--dim)}
.card .kv span:last-child{font-family:var(--mono);color:#e6edf3}
.card .kv span.up:last-child{color:var(--up)} .card .kv span.down:last-child{color:var(--down)}
.card .bw{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6}
.bench{margin:12px 16px 0;font-size:13px;color:var(--dim);position:relative;z-index:2}
.bench b{font-family:var(--mono);font-weight:500}
.summ{margin:12px 16px 0;padding:10px 12px;border-left:3px solid var(--pink);background:#160c12;font-size:13.5px;line-height:1.65;border-radius:0 6px 6px 0;position:relative;z-index:2}
.summ ul{margin:6px 0 0;padding-left:18px;color:#aeb7c2}
h3.sec{margin:18px 16px 8px;font-size:15px;color:#f0f6fc;position:relative;z-index:2}
table.t{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:13px;position:relative;z-index:2}
table.t th{font-weight:500;color:var(--dim);font-size:11.5px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 6px;border-bottom:1px solid #1a2028;text-align:right;font-family:var(--mono);white-space:nowrap}
table.t th:nth-child(-n+2),table.t td:nth-child(-n+2){text-align:left}
table.t td.nm{font-family:var(--sans);white-space:normal} table.t td.nm small{font-family:var(--mono);color:var(--dim);margin-left:4px}
table.t td.rk{color:var(--dim);width:22px}
.tblwrap{overflow-x:auto;padding-bottom:6px}
/* history */
.chart{margin:14px 16px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 10px 6px;position:relative;z-index:2}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin:6px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kw{border-radius:2px;transition:all .15s}
.kw.h1{outline:1px solid var(--cyan);color:#e6f7ff} .kw.h2{background:var(--pink);color:#fff} .kw.h3{color:var(--yellow);font-style:italic} .kw.h4{background:#39c5e655;color:#fff}
/* lock screen (encrypted build) */
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;background:radial-gradient(70% 55% at 50% 38%,#1d0f38 0%,#0b0d18 58%,#07090d 100%)}
.lock[hidden]{display:none}
.lock::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%)}
.lk{position:relative;width:100%;max-width:360px;text-align:center;padding:30px 24px 22px;border:1px solid #2f2550;border-radius:16px;background:rgba(13,10,26,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 24px 70px -24px #7c3aedcc}
.lk-orb{display:flex;justify-content:center;gap:5px;margin:0 auto 18px;height:78px}
.lk-orb i{width:40px;height:76px;border:1.6px solid var(--cyan);border-radius:70% 18% 18% 70%/60% 30% 30% 60%;box-shadow:0 0 16px #39c5e6aa,inset 0 0 18px #39c5e655;animation:breath 2.4s ease-in-out infinite}
.lk-orb i+i{border-color:var(--pink);border-radius:18% 70% 70% 18%/30% 60% 60% 30%;box-shadow:0 0 16px #ff4f8baa,inset 0 0 18px #ff4f8b55;animation-delay:1.2s}
@keyframes breath{50%{filter:brightness(1.6);transform:scale(1.04)}}
.lk-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--pink);text-shadow:0 0 10px #ff4f8b88}
.lk h2{margin:6px 0 4px;font-size:22px;color:#f0f6fc;letter-spacing:.04em}
.lk-s{margin:0 0 16px;color:#aeb7c2;font-size:14px}
.lk input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;border:1px solid #3b3260;background:#0a0814;color:#f0f6fc;outline:none}
.lk input[type=password]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #39c5e633}
.lk-r{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:13px;color:#aeb7c2;cursor:pointer;user-select:none;text-align:left}
.lk-r input{width:16px;height:16px;margin:0;accent-color:#a371f7}
.lk button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:9px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(90deg,#1f6feb,#a371f7 60%,#ff4f8b);cursor:pointer;letter-spacing:.3em}
.lk button:disabled{opacity:.6;cursor:wait}
.lk-e{min-height:20px;margin-top:10px;font-size:13px;color:var(--up)}
.lk-n{margin-top:4px;font-size:11.5px;color:#5f6773;line-height:1.6}
.lk.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nt.lockb{margin-left:auto;font-size:12px;color:var(--dim)}
.nt.brainl{text-decoration:none;color:#8fd8ff;display:inline-flex;align-items:center}
/* brain hero (neural map of real hot items) */
.hero{position:relative;margin:14px 0 4px;border:1px solid #2b2342;border-radius:14px;overflow:hidden;isolation:isolate;
 background:radial-gradient(60% 75% at 42% 52%,#1d0f38 0%,#0d0f1f 55%,#07090f 100%);box-shadow:0 18px 50px -24px #7c3aedaa,inset 0 0 80px #000c}
.hero[hidden]{display:none}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:26px 26px;
 -webkit-mask-image:radial-gradient(ellipse at 45% 50%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 45% 50%,#000 25%,transparent 78%)}
.hero .cr{position:absolute;width:14px;height:14px;border:0 solid #39c5e6;opacity:.7;pointer-events:none}
.hero .cr.tl{left:6px;top:6px;border-left-width:1.5px;border-top-width:1.5px}.hero .cr.tr{right:6px;top:6px;border-right-width:1.5px;border-top-width:1.5px}
.hero .cr.bl{left:6px;bottom:6px;border-left-width:1.5px;border-bottom-width:1.5px}.hero .cr.br{right:6px;bottom:6px;border-right-width:1.5px;border-bottom-width:1.5px}
.hhead{display:flex;align-items:baseline;gap:4px 10px;padding:13px 18px 0;flex-wrap:wrap}
.hhead .hk{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--pink);text-shadow:0 0 10px #ff4f8b99}
.hhead b{font-size:16px;color:#f0f6fc;letter-spacing:.06em;text-shadow:0 0 14px #a371f766}
.hhead .hs{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.hhead .hs em{font-style:normal;color:var(--cyan)}
.hcv{position:relative;height:440px}
.hcv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btip{position:absolute;left:0;top:0;z-index:5;width:max-content;max-width:min(320px,calc(100% - 16px));padding:10px 12px;border:1px solid #47367a;border-radius:10px;background:rgba(11,8,22,.94);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 10px 30px #000b,0 0 22px #a371f744;font-size:12.5px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;visibility:hidden}
.btip.on{opacity:1;transform:none;visibility:visible}
.btip.sel{pointer-events:auto}
.btip .tt-h{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
.btip .tt-r{font-weight:700;font-size:13px}
.btip .tt-t{color:#f0f6fc;font-weight:600;font-size:13.5px;margin-top:3px}
.btip .tt-g{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.btip .tt-g .tg{font-size:11px;padding:1px 6px}
.btip .tt-m{color:var(--dim);font-size:11.5px;margin-top:6px}
.btip .tt-go{margin-top:8px;font-size:12.5px;color:#fff;background:#1f6feb;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.hfoot{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:0 18px 13px;font-size:11.5px;color:var(--dim)}
.bfire{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9d1d9;cursor:pointer}
.bfire i{font-style:normal;color:var(--yellow);margin-right:4px} .bfire b{font-weight:700;margin-right:6px}
.bfire.pop{animation:pop .5s}
@keyframes pop{0%{text-shadow:0 0 12px #fff8;color:#fff}100%{text-shadow:none}}
.leg{display:flex;gap:4px 12px;flex-wrap:wrap}
.leg span{white-space:nowrap} .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.leg i.dl{width:14px;height:0;border-radius:0;border-top:1.5px dashed #c39bff;vertical-align:3px}
.row.nodeon{background:linear-gradient(90deg,#a371f71f,transparent 70%)}
.dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px;margin-top:9px;max-width:440px}
.dm{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--dim);min-width:0}
.dm b{font-weight:500;white-space:nowrap} .dm em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11.5px;color:#e6edf3}
.dm i{flex:0 0 100%;display:block;height:3px;border-radius:2px;background:#232a33;overflow:hidden}
.dm u{display:block;height:100%;border-radius:2px;box-shadow:0 0 6px currentColor}
.dm-surprise u{background:#ff4f8b;color:#ff4f8b88} .dm-impact u{background:#a371f7;color:#a371f788} .dm-timeliness u{background:#39c5e6;color:#39c5e688} .dm-authority u{background:#e3b341;color:#e3b34188}

.wline{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.02em}
.btip .dims{margin-top:8px;max-width:none;gap:4px 8px}
canvas#net{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
footer{margin-top:18px;font-size:12.5px;color:var(--dim);line-height:1.7;padding:0 4px}
footer .srcs{font-family:var(--mono);font-size:11px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
footer .srcs span{white-space:nowrap} footer .srcs span.wr{white-space:normal}
.disc{margin-top:10px;color:#9aa4ae}
.pad{height:14px}

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SRC_COLORS={'财联社':'#f0524f','新浪财经':'#e3b341','华尔街见闻':'#4493f8','证券时报':'#a371f7','东方财富':'#39c5e6','中国人民银行':'#ff4f8b','中国政府网':'#ff7b72'};
const srcColor=n=>{for(const k in SRC_COLORS){if(String(n).indexOf(k)>=0)return SRC_COLORS[k]}let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return 'hsl('+h+',60%,62%)'};
const SENT={bull:['利好','up'],bear:['利空','down'],mixed:['多空交织','flat']};
const TABS=[['hot','盘前热点','hot'],['am','早盘15支','picks_am'],['pm','午后15支','picks_pm'],['review','收盘复盘','review'],['history','历史','history']];
const STAGE_DESC={hot:'盘前热点 Top 20',am:'早盘15支关注名单',pm:'午后15支关注名单（12:45，V3.3）',review:'收盘复盘',history:'历史表现'};
let D=null,HOTV='main',CUR='hot',NET=null,FLK=null,CD=null,NETRAF=0,NETVIS=true;

const cls=v=>v==null||isNaN(v)?'flat':v>0?'up':v<0?'down':'flat';
const pct=(v,d=2)=>v==null||isNaN(v)?'—':(v>0?'+':'')+(+v).toFixed(d)+'%';
const rate=v=>v==null||isNaN(v)?'—':Math.round(v*100)+'%';
const price=v=>v==null||isNaN(v)?'—':(+v).toFixed(2);
const amt=v=>v==null||isNaN(v)?'—':v>=1e8?(v/1e8).toFixed(2)+'亿':v>=1e4?(v/1e4).toFixed(0)+'万':String(v);
const avg=a=>{a=a.filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
function bjNow(){const d=new Date(Date.now()+8*3600e3);return {date:d.toISOString().slice(0,10),min:d.getUTCHours()*60+d.getUTCMinutes(),ms:d.getTime()}}
function safeUrl(u){if(u==null||u==='')return '';try{const x=new URL(String(u).trim());return (x.protocol==='http:'||x.protocol==='https:')?x.href:''}catch(e){return ''}}
function extLink(u,html){const s=safeUrl(u);return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">'+html+'</a>':html}
const toMin=s=>{const[a,b]=String(s).split(':');return +a*60+ +b};
function quoteUrl(p){const c=String(p.code||'');if(!/^\d{6}$/.test(c))return '';let ex=(p.exchange||'').toLowerCase();if(!ex)ex=/^6/.test(c)?'sh':/^[03]/.test(c)?'sz':'bj';return ex==='bj'?'https://quote.eastmoney.com/bj/'+c+'.html':'https://quote.eastmoney.com/'+ex+c+'.html'}
function part(tab){const k=TABS.find(t=>t[0]===tab)[2];const v=D[k];return Array.isArray(v)?(v.length?v:null):v}
function isEx(tab){const p=part(tab);if(!p)return false;return Array.isArray(p)?p.some(r=>r.example):!!p.example}

function load(){return fetch('data/latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>JSON.parse($('#embedded').textContent))}
function fmtCount(n,o){o=o||{};const d=o.dec||0;let s=d?Math.abs(n).toFixed(d):Math.round(Math.abs(n)).toLocaleString('en-US');return (n<0?'-':(o.sign&&n>0?'+':''))+s+(o.suf||'')}
function countUp(el,to,o,ms){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=fmtCount(to*e,o);if(p<1)requestAnimationFrame(f)})(t0)}
function counters(list){
  $('#stats').innerHTML=list.map(s=>'<div class="stat"><div class="lbl">'+esc(s[0])+'</div><div class="num">'+(s[1]==null?'—':'0')+'</div></div>').join('');
  $$('.stat .num').forEach((el,i)=>{const s=list[i];if(s[1]==null)return;const o=s[2]||{};if(o.color)el.classList.add(cls(s[1]));if(RM.matches){el.textContent=fmtCount(+s[1],o);return}setTimeout(()=>countUp(el,+s[1],o,1300+i*150),120*i)});
}
let KW=['加息','降息','跌停','涨停','新高','扭亏','预增','竞价','放量','龙头','订单','回购','增持','减持'];
function wrapKw(html){
  const words=KW;
  let out=html.replace(/(\d+(?:\.\d+)?(?:%|亿元|亿|万吨|美元))/g,'<span class="kw">$1</span>');
  words.forEach(w=>{w=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');out=out.replace(new RegExp('(^|[^>])('+w+')(?![^<]*<\\/span>)'),'$1<span class="kw">$2</span>')});
  return out;
}
function setHead(title,meta,mood,note){$('#h1').textContent=title;$('#meta').textContent=meta||'';$('#mood').textContent=mood||'';$('#note').innerHTML=note?'<div class="note">'+esc(note)+'</div>':''}
function exBanner(tab){$('#ex').innerHTML=isEx(tab)?'<div class="exb">⚠ 示例数据 · EXAMPLE<small>本页为版式预览，股票名称取自今晚热点，价格、涨跌、收益均为虚构，不代表任何真实行情或推荐。</small></div>':''}
function strip(list,t){$('#strip').innerHTML=(list||[]).map(s=>{const c=s.chg_pct;const v=s.last>=1000?s.last.toLocaleString('en-US',{maximumFractionDigits:2}):(+s.last).toFixed(s.last<20?4:2);
  return '<div class="tick"><div class="n">'+esc(s.label||s.name)+'</div><div class="v">'+esc(v)+'</div><div class="c '+cls(c)+'">'+pct(c)+'</div></div>'}).join('');$('#snapt').textContent=t||''}

function placeholder(tab){
  const now=bjNow(),sch=(D.schedule||{})[tab==='history'?'review':tab]||'';
  let t,s=STAGE_DESC[tab]+'尚未生成';
  if(D.date===now.date){
    if(sch&&now.min<toMin(sch)){t='今日 '+sch+' 发布';s=STAGE_DESC[tab]+'将在交易日 '+sch+' 自动生成并更新到这里';}
    else{t='今日 '+sch+' 应已发布';s='数据暂未生成，可能仍在处理中，稍后刷新';}
  }else{t=(D.date||'').slice(5)+' 暂无此数据';s=sch?('每个交易日 '+sch+' 发布'+STAGE_DESC[tab]):s}
  const prev=['review','pm','am','hot'].find(k=>k!==tab&&part(k));
  return '<div class="ph"><div class="ph-t">'+esc(t)+'</div><div class="ph-s">'+esc(s)+'</div><div class="ph-c" id="cd"></div>'
   +(prev?'<span class="ph-r" data-go="'+prev+'">查看'+esc(TABS.find(x=>x[0]===prev)[1])+' →</span>':'')+'</div>';
}
function startCountdown(tab){
  clearInterval(CD);const now=bjNow(),sch=(D.schedule||{})[tab==='history'?'review':tab];
  if(!sch||D.date!==now.date||now.min>=toMin(sch))return;
  const tgt=Date.parse(D.date+'T'+sch+':00+08:00');
  const f=()=>{const el=$('#cd');if(!el){clearInterval(CD);return}let s=Math.max(0,Math.round((tgt-Date.now())/1000));
    el.textContent='距发布 '+[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':');if(!s)clearInterval(CD)};
  f();CD=setInterval(f,1000);
}

const DIMS=[['surprise','意外','意外性'],['impact','影响','影响力'],['timeliness','时效','时效'],['authority','权威','权威性']];
const DEFW={surprise:.4,impact:.3,timeliness:.15,authority:.15};
function hasDims(it){const d=it&&it.dims;return !!d&&DIMS.every(k=>typeof d[k[0]]==='number'&&isFinite(d[k[0]]))}
const hasScoreV=it=>it&&typeof it.score==='number'&&isFinite(it.score);
function dimsHtml(it){if(!hasDims(it))return '';
  return '<div class="dims">'+DIMS.map(([k,l,L])=>{const v=Math.max(0,Math.min(10,+it.dims[k]));return '<span class="dm dm-'+k+'" title="'+L+' '+v+'/10"><b>'+l+'</b><em>'+(Number.isInteger(v)?v:v.toFixed(1))+'</em><i><u style="width:'+(v*10)+'%"></u></i></span>'}).join('')+'</div>'}
function weightsLine(H){const items=(H&&H.items)||[];if(!(H&&H.weights)&&!items.some(hasDims))return '';const w=(H&&H.weights)||DEFW;
  return '排序：'+DIMS.map(([k,,L])=>L+Math.round((+w[k]||0)*100)+'%').join(' · ')}
// ---------- tab renderers ----------
function curHot(){return (HOTV==='alt'&&D.hot_alt)?D.hot_alt:D.hot}
function setHotV(v){HOTV=v;BR.items=[];BR.W=0;show('hot',{noScroll:true});if(BR.on&&brainLayout(true))brainStart()}

      +(sel?'<button class="tt-go" data-jump="'+it.rank+'">查看详情 ↓</button>':'<div class="tt-m">点击节点 → 跳到详情卡片</div>');
  }else{const s=BR.srcs[hit.i];node=s;
    html='<div class="tt-h"><span class="tt-r" style="color:'+s.col+'">● '+esc(s.name)+'</span></div><div class="tt-t">被 '+s.n+' 条热点引用</div><div class="tt-m">'+s.ranks.map(r=>'#'+r).join('  ')+'</div>'}
  tp.innerHTML=html;tp.classList.add('on');tp.classList.toggle('sel',!!sel);
  const tw=tp.offsetWidth,th=tp.offsetHeight;let x,y;
  if(BR.mob){x=(BR.W-tw)/2;y=hit.k==='s'?node.y+16:BR.b.bcy-th/2;}
  else if(hit.k==='i'){x=node.x-tw-22;y=node.y-th/2}
  else{x=node.x+16;y=node.y-th/2}
  tp.style.left=Math.max(8,Math.min(BR.W-tw-8,x))+'px';tp.style.top=Math.max(8,Math.min(BR.H-th-8,y))+'px';
  const bt=tp.querySelector('[data-jump]');if(bt)bt.onclick=ev=>{ev.stopPropagation();jumpCard(+bt.dataset.jump)};
}
function jumpCard(r){
  const el=document.getElementById('hot-'+r);if(!el)return;
  const q=$('#q');if(q&&q.value){q.value='';q.oninput()}
  if(el.classList.contains('hide')){const all=$('#flt .tab[data-f="all"]');if(all)all.click()}
  BR.sel=-1;BR.hs=-1;tipHide();brainKick();
  el.classList.add('open');el.scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  setTimeout(layoutNet,40);
}
function brainHover(rank,on){const o=BR.items.find(x=>x.rank===rank);if(!o)return;BR.hl=on?o.i:-1;const el=document.getElementById('hot-'+rank);if(el)el.classList.toggle('nodeon',on);brainKick()}
function brainBind(){
  if(BR.bound)return;BR.bound=true;const cv=$('#brain');
  const loc=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  const setHover=hit=>{const hl=hit&&hit.k==='i'?hit.i:-1,hs=hit&&hit.k==='s'?hit.i:-1;if(hl===BR.hl&&hs===BR.hs)return;BR.hl=hl;BR.hs=hs;
    $$('#body .row.nodeon').forEach(r=>r.classList.remove('nodeon'));if(hl>=0){const el=document.getElementById('hot-'+BR.items[hl].rank);if(el)el.classList.add('nodeon')}
    hit?tipShow(hit,false):tipHide();cv.style.cursor=hit?'pointer':'crosshair';brainKick()};
  cv.addEventListener('pointerdown',e=>{BR.ptr=e.pointerType||'mouse'});
  cv.addEventListener('pointermove',e=>{if((e.pointerType||'mouse')==='mouse'){BR.ptr='mouse';setHover(brainHit(...loc(e)))}});
  cv.addEventListener('pointerleave',e=>{if((e.pointerType||'mouse')==='mouse')setHover(null)});
  cv.addEventListener('click',e=>{const hit=brainHit(...loc(e));
    if(BR.ptr==='mouse'){if(hit&&hit.k==='i')jumpCard(BR.items[hit.i].rank);return}
    if(!hit){BR.sel=-1;BR.hs=-1;tipHide();brainKick();return}
    if(hit.k==='i'){if(BR.sel===hit.i){jumpCard(BR.items[hit.i].rank);return}BR.sel=hit.i;BR.hs=-1}else{BR.sel=-1;BR.hs=hit.i}
    tipShow(hit,true);brainKick()});
  $('#bfire').addEventListener('click',()=>{const r=+$('#bfire').dataset.rank;if(r)jumpCard(r)});
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{BR.vis=es[es.length-1].isIntersecting;brainStart()}).observe($('#hero'));
  document.addEventListener('visibilitychange',brainStart);
  if(RM.addEventListener)RM.addEventListener('change',()=>{brainLayout(true);brainStart()});
  let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(BR.on&&brainLayout())brainStart()},150)});
}
function brainShow(on){
  const HH=curHot(),hero=$('#hero');on=!!(on&&HH&&(HH.items||[]).length);hero.hidden=!on;BR.on=on;tipHide();
  if(!on){if(BR.raf){cancelAnimationFrame(BR.raf);BR.raf=0}return}
  if(!BR.items.length)brainInit(HH);
  brainBind();BR.filter='all';BR.sel=-1;BR.hl=-1;BR.hs=-1;
  brainLayout();brainStart();
}

function rawPanel(){
  const S=D.raw_status;if(!S)return '';
  const r=S.run||{},m=S.manifest||{},st=r.status||'—',c=st==='OK'?'down':st==='PARTIAL'?'flat':'up';
  const col=st==='PARTIAL'?'style="color:var(--yellow)"':'';
  const kv=[['最近一次运行',(r.finished_at||r.started_at||'—')+(r.mode?'（'+r.mode+'）':'')],['来源',(r.sources_ok!=null?r.sources_ok:'—')+' / '+(r.sources_total!=null?r.sources_total:'—')+' 正常'+((S.failed_sources||[]).length?'，异常：'+S.failed_sources.join('、'):'')],
    [(S.date&&S.date!==D.date?S.date.slice(5)+' ':'当日')+'原始行数',S.raw_lines_today!=null?fmtCount(S.raw_lines_today):'—'],['最新推送',m.pushed_at||'—'],['文件 sha256',m.sha256_short?m.sha256_short+'…':'—'],['抓取器',m.crawler_version||r.crawler_version||'—']];
  if(S.push_verify)kv.push(['推送校验',S.push_verify.status||'—']);
  return '<section class="rawp" id="rawp"><h4>原始层采集状态 <span class="'+c+'" '+col+'>● '+esc(st)+'</span></h4><div class="kv2">'+kv.map(x=>'<span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span>').join('')+'</div></section>';
}
function rulesBox(){
  const w=(D.hot&&D.hot.weights)||DEFW,P=x=>Math.round((+x||0)*100)+'%';
  return '<details class="rules" id="rules"><summary>规则说明</summary><div class="rb">'
   +'<h5>盘前热点排序</h5><ul><li>四项各打 0–10 分：意外性 '+P(w.surprise)+' · 影响力 '+P(w.impact)+' · 时效 '+P(w.timeliness)+' · 权威性 '+P(w.authority)+'；总分 = 加权和 × 10（0–100），按总分从高到低排。</li><li>传闻、未证实、单一匿名来源的权威性不超过 3 分。</li></ul>'
   +'<h5>入场规则</h5><ul><li>早盘：09:30 及之后连续竞价的第一笔成交价；9:25 集合竞价价只作筛选参考，永远不当入场价。</li><li>午后：名单生成时刻之后的第一笔成交价；筛选时的快照价不是入场价。</li></ul>'
   +'<h5>名单存证</h5><ul><li>名单生成时计算 sha256，登记到账本（ledger.jsonl），并推送到私有仓库。</li><li>复盘前核对账本；哈希对不上，复盘状态为 INVALID，不计入历史累计。</li></ul>'
   +'<h5>复盘口径</h5><ul><li>主口径：次日开盘卖出（A 股 T+1，当天买入当天不能卖）；当日收盘盯市只作参考。</li><li>费用：佣金买卖各 0.01%（无最低收费），印花税仅卖出 0.05%；悲观情形每边再加 0.2% 滑点。</li><li>入场时一字涨停视为买不到，不计入收益；卖出时跌停顺延到下一交易时段第一笔非跌停成交。</li><li>主基准：当天随机对照（15 只非 ST、非停牌、换手达标的 A 股，重复 N 次取平均）；沪深300 只作次要参考。</li></ul>'
   +'<h5>原始层采集</h5><ul><li>只追加、不筛选、不合并、不删除；同一事件每条报道各占一行。</li><li>东方财富公告全部入库，用 ann_keyword_hit 只打标签，不过滤。</li><li>body_basis 不是全文（feed_summary / title_only）的条目，下游跳过哈希比对。</li></ul>'
   +'<h5>数据安全</h5><ul><li>整页数据 AES-256-GCM 加密，只有输入访问密码后才在本机解密；仓库里没有明文名单和复盘。</li></ul>'
   +'</div></details>';
}
function footer(){
  $('#xtra').innerHTML=rawPanel()+rulesBox();
  const H=D.hot,st=(H&&H.source_status)||[];
  $('#foot').innerHTML=(H&&H.trading_note?'<div>📅 '+esc(H.trading_note)+'</div>':'')
    +(st.length?'<div class="srcs">'+st.map(s=>'<span class="'+(s.ok?'down':'up')+'">'+(s.ok?'●':'○')+' '+esc(s.name)+' '+(s.ok?s.n:'失败')+'</span>').join('')+'</div>':'')
    +'<div class="srcs"><span class="wr">发布时间（交易日）：热点 '+esc(D.schedule.hot)+' · 早盘 '+esc(D.schedule.am)+' · 午后 '+esc(D.schedule.pm)+'（14:45 暂停）· 复盘 '+esc(D.schedule.review)+'</span><span>页面生成 '+esc(D.generated)+'</span></div>'
    +'<div class="disc">'+esc(D.disclaimer||'内容仅供参考，不构成投资建议。')+'</div>';
}
function start(d){
  D=d;D.schedule=D.schedule||{hot:'09:02',am:'09:25',pm:'12:45',review:'15:20'};
  KW=[...new Set(KW.concat(((D.hot&&D.hot.items)||[]).flatMap(i=>[...(i.bull||[]),...(i.bear||[])]).map(t=>String(t).replace(/[（(].*$/,'').trim()).filter(t=>t.length>=2&&t.length<=6)))];
  $('#nav').innerHTML=TABS.map(t=>'<button class="nt" data-t="'+t[0]+'">'+t[1]+'<span class="pd'+(part(t[0])?(isEx(t[0])?' ex':' ok'):'')+'"></span></button>').join('')
    +'<a class="nt brainl" href="./brain/">🧠 资金大脑</a><a class="nt brainl" href="./verify/">✅ 验证板</a>'+(ENC?'<button class="nt lockb" id="lockb" title="锁定并清除本设备记住的密钥">🔒 锁定</button>':'');
  $$('.nt[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
  if(ENC)$('#lockb').onclick=lockNow;
  const q=$('#q');q.oninput=()=>{const v=q.value.trim().toLowerCase();$$('.row,table.t tbody tr').forEach(r=>r.classList.toggle('hide',!!v&&r.textContent.toLowerCase().indexOf(v)<0));setTimeout(layoutNet,30)};
  addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
  addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==CUR&&TABS.some(t=>t[0]===h))show(h,{keepHash:true})});
  footer();show(defaultTab(),{keepHash:true});
}

// ---------- encrypted build: lock screen + Web Crypto decrypt ----------
let ENC=null;const KEYPFX='ashare_dash_key:';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt'])}
function aadOf(E){return new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt)}
async function decryptBundle(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockUI(msg){$('.wrap').hidden=true;$('#lock').hidden=false;$('#lke').textContent=msg||'';setTimeout(()=>{try{$('#lkp').focus()}catch(e){}},60)}
function unlocked(d){$('#lock').hidden=true;$('.wrap').hidden=false;start(d)}
function lockNow(){try{if(ENC)localStorage.removeItem(KEYPFX+ENC.salt)}catch(e){}D=null;location.reload()}
function encOk(E){try{
  if(!E||E.v!==2||E.alg!=='AES-256-GCM'||E.kdf!=='PBKDF2-SHA256')return false;
  if(!Number.isInteger(E.iter)||E.iter<100000||E.iter>2000000)return false;
  return b64d(E.salt).length===16&&b64d(E.iv).length===12&&b64d(E.ct).length>16}catch(e){return false}}
async function boot(){
  const emb=JSON.parse($('#embedded').textContent);
  if(!emb||!emb.enc){load().then(start);return}
  ENC=emb.enc;$('.wrap').hidden=true;
  if(!encOk(ENC)){lockUI('页面数据校验失败（加密参数异常或文件损坏），无法解锁。请刷新页面，或稍后再试。');$('#lkb').disabled=true;$('#lkp').disabled=true;return}
  const sk=KEYPFX+ENC.salt;
  if(!(window.crypto&&crypto.subtle)){lockUI('当前浏览器不支持页面解密，请用 HTTPS 链接和新版浏览器打开');$('#lkb').disabled=true;return}
  let saved=null;try{saved=localStorage.getItem(sk)}catch(e){}
  if(saved){try{const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);unlocked(await decryptBundle(key,ENC));return}
    catch(e){try{localStorage.removeItem(sk)}catch(_){}lockUI('已记住的密钥已失效（密码可能已更换），请重新输入')}}
  else lockUI('');
  $('#lkf').onsubmit=async ev=>{ev.preventDefault();const inp=$('#lkp'),pw=inp.value,btn=$('#lkb'),f=$('#lkf');
    if(!pw){$('#lke').textContent='请输入访问密码';return}
    btn.disabled=true;btn.textContent='解密中…';$('#lke').textContent='';const rem=$('#lkr').checked;
    let d=null,key=null;
    try{key=await pwKey(pw,ENC,rem);d=await decryptBundle(key,ENC)}catch(e){d=null}
    if(!d){btn.disabled=false;btn.textContent='解锁';$('#lke').textContent='密码错误，请重试';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');inp.select();return}
    if(rem){try{localStorage.setItem(sk,b64e(await crypto.subtle.exportKey('raw',key)))}catch(e){}}
    inp.value='';unlocked(d)};
}
boot();
})();
