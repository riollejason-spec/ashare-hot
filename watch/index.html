<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>自选观察看板</title>
<style>
:root{
  --bg:#07090d; --panel:#10141b; --panel2:#161b24; --line:#252c38; --line2:#1a2029;
  --txt:#e8edf5; --muted:#8b95a8; --dim:#5c6678;
  --red:#ef4444; --red2:#f87171; --green:#12b981; --green2:#34d399;
  --gold:#f5c84c; --blue:#60a5fa; --cyan:#22d3ee; --accent:#3b82f6;
  --up:var(--red); --down:var(--green);
  --row-h:32px;
  --sans:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Sarasa Mono SC","Consolas","Menlo",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 var(--sans);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% 20%,#152033,var(--bg));z-index:50}
#lock[hidden],.app[hidden]{display:none!important}
.lockbox{width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 28px 22px;box-shadow:0 20px 50px #0008}
.lockbox h1{margin:0 0 4px;font-size:18px;font-weight:650;letter-spacing:.04em}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:12px}
.lockbox input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);background:#0b0e14;border-radius:6px;outline:none}
.lockbox input:focus{border-color:#3b82f6}
.lockrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:12px}
.lockrow label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.lockbox button{background:#2563eb;border:0;color:#fff;padding:8px 16px;border-radius:6px;font-weight:600}
.lockerr{min-height:1.2em;color:var(--red);font-size:12px;margin-top:10px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.banner{flex:0 0 auto;background:#5a3d0a;color:#ffe7b3;text-align:center;padding:6px 12px;font-weight:700;letter-spacing:.08em;font-size:13px;border-bottom:1px solid #8a6214}
.banner span{font-weight:500;opacity:.85;margin-left:10px;letter-spacing:0}
.topbar{flex:0 0 42px;display:flex;align-items:center;gap:16px;padding:0 14px;background:linear-gradient(#171d28,#10151d);border-bottom:1px solid var(--line);user-select:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:.12em;font-size:14px}
.brand i{width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,#ef4444,#f59e0b);display:block}
.topmeta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.topmeta b{color:var(--txt);font-weight:650;font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:#1c2430;border:1px solid var(--line);font-size:11px}
.pill.up{color:var(--up)} .pill.down{color:var(--down)} .pill.gold{color:var(--gold);border-color:#5a4a1a;background:#2a210c}
.spacer{flex:1}
.main{flex:1;min-height:0;display:grid;grid-template-columns:430px 1fr}
.left{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
.tools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:90px;background:#0b0e14;border:1px solid var(--line);border-radius:4px;padding:5px 8px;outline:none}
.tools input:focus{border-color:#3b82f6}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:#0f141c;color:var(--muted);border-radius:4px;padding:2px 7px;font-size:11px}
.chip.on{color:#fff;border-color:transparent;background:#1d4ed8}
.chip[data-s="Grok"].on{background:#1e3a8a}
.chip[data-s="Muse"].on{background:#6d28d9}
.chip[data-s="资金流"].on{background:#b45309}
.chip[data-s="新思路"].on{background:#047857}
.chip[data-s="老思路"].on{background:#475569}
.chip[data-s="J6"].on{background:#9f1239}
.chip[data-s="H1"].on{background:#0e7490}
.tblwrap{flex:1;min-height:0;overflow:auto}
table.wl{width:100%;border-collapse:collapse;font-size:12px}
table.wl th,table.wl td{padding:0 8px;height:var(--row-h);border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right}
table.wl th{position:sticky;top:0;background:#141a23;color:var(--muted);font-weight:600;font-size:11px;z-index:1;cursor:pointer;user-select:none}
table.wl th:hover{color:var(--txt)}
table.wl th.l,table.wl td.l{text-align:left}
table.wl td.code{font-family:var(--mono);color:#c5d0e0;letter-spacing:.02em}
table.wl td.name{max-width:72px;overflow:hidden;text-overflow:ellipsis}
table.wl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.wl tr.row{cursor:pointer}
table.wl tr.row:hover{background:#1a2230}
table.wl tr.row.sel{background:#1e3a5f;box-shadow:inset 3px 0 0 #3b82f6}
table.wl tr.row.sel td{color:#fff}
.sec-h{position:sticky;top:0;z-index:2;background:#1a140f;color:#e8c48a;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-bottom:1px solid #3a2e1c}
table.wl tr.drop{opacity:.72}
table.wl tr.drop:hover{opacity:1}
.badges{display:flex;gap:3px;justify-content:flex-end}
.bdg{font-size:10px;line-height:16px;padding:0 5px;border-radius:3px;color:#fff;font-weight:650}
.bdg.Grok{background:#2563eb} .bdg.Muse{background:#7c3aed}
.bdg.资金流{background:#d97706} .bdg.新思路{background:#059669}
.bdg.老思路{background:#64748b} .bdg.J6{background:#e11d48} .bdg.H1{background:#0891b2}
.st{font-size:11px;font-weight:700}
.st.new{color:var(--gold)} .st.cont{color:#7dd3fc} .st.out{color:#94a3b8}
.up{color:var(--up)!important} .down{color:var(--down)!important} .flat{color:var(--muted)!important}
.right{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(260px,1fr) minmax(320px,38%);background:var(--bg)}
.chartbox{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line);background:#0b0e14}
.chd{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 4px;min-height:46px}
.chd .nm{font-size:16px;font-weight:750}
.chd .cd{font-family:var(--mono);color:var(--muted);margin-left:6px;font-size:12px;font-weight:500}
.chd .px{font-family:var(--mono);font-size:22px;font-weight:700;margin-left:8px}
.chd .chg{font-family:var(--mono);font-size:14px;font-weight:650}
.chd .tog{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.chd .tog button{background:transparent;border:0;padding:4px 12px;color:var(--muted)}
.chd .tog button.on{background:#1d4ed8;color:#fff}
.mfhint{margin-left:10px;font-size:11px;color:var(--dim);border:1px dashed #334155;padding:2px 8px;border-radius:4px}
.mfhint.on{color:#86efac;border-style:solid;border-color:#14532d}
.legend{padding:0 14px 4px;font-size:11px;color:var(--muted);display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:10px;height:2px;margin-right:4px;vertical-align:middle}
.warn{color:var(--gold)!important}
#cv{flex:1;min-height:0;width:100%;display:block}
.tabs{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.tabbar{display:flex;border-bottom:1px solid var(--line);flex:0 0 34px}
.tabbar button{flex:0 0 auto;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:0 16px;height:34px}
.tabbar button.on{color:var(--txt);border-bottom-color:#3b82f6;font-weight:650}
.tabpane{flex:1;min-height:0;overflow:auto;padding:10px 14px 16px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0;height:100%}
.col{min-height:0;overflow:auto;padding-right:4px}.col h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;position:sticky;top:0;background:var(--panel);padding:2px 0}
.col h3 em{font-style:normal;color:var(--txt);margin-left:6px}
.item{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:12px}
.item:hover{background:#1a2230}
.item .c{font-family:var(--mono);width:74px}
.item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc table{width:100%;border-collapse:collapse;font-size:12px}
.acc th,.acc td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right}
.acc th{color:var(--muted);font-weight:600;font-size:11px}
.acc td.l,.acc th.l{text-align:left}
.acc .rank{width:28px;text-align:center;color:var(--gold);font-weight:700}
.yrows{margin-top:14px}
.yrows h3{margin:0 0 8px;font-size:12px;color:var(--muted)}
.note-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:#1e293b;border:1px solid #334155;border-radius:999px;padding:1px 8px;font-size:11px;color:#cbd5e1}
.tag button{border:0;background:none;color:#64748b;margin-left:4px;padding:0}
#tagin,#notein{width:100%;background:#0b0e14;border:1px solid var(--line);border-radius:6px;padding:8px}
#notein{min-height:110px;resize:vertical;line-height:1.55}
.note-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:#1e293b;border:1px solid #334155;border-radius:6px;padding:5px 10px;color:var(--txt)}
.btn:hover{border-color:#3b82f6}
.btn.pri{background:#1d4ed8;border-color:#1d4ed8}
.hint{color:var(--dim);font-size:11px;margin-top:8px}
.footnote{color:var(--dim);font-size:11px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="lock" hidden>
  <form class="lockbox" id="lkf">
    <h1>自选观察看板</h1>
    <p>页面已加密，请输入与主看板相同的访问密码。</p>
    <input id="lkp" type="password" autocomplete="current-password" placeholder="访问密码" autofocus>
    <div class="lockrow">
      <label><input type="checkbox" id="lkr"> 在本设备记住</label>
      <button type="submit" id="lkb">解锁</button>
    </div>
    <div class="lockerr" id="lke"></div>
  </form>
</div>
<div class="app" hidden>
  <div class="banner" id="banner" hidden>示例数据<span>名单为演示用，导入真实数据并删除 inbox/EXAMPLE 后此横幅会消失</span></div>
  <div class="topbar">
    <div class="brand"><i></i>自选观察</div>
    <div class="topmeta">
      <span>名单日 <b id="asof"></b></span>
      <span>共 <b id="nAll">0</b> 只</span>
      <span class="pill gold">新 <b id="nNew">0</b></span>
      <span class="pill">连 <b id="nCont">0</b></span>
      <span class="pill">掉出 <b id="nOut">0</b></span>
      <span>名单均涨跌 <b id="avgChg">—</b></span>
      <span>收盘后更新</span>
    </div>
    <div class="spacer"></div>
    <div class="topmeta"><span id="gen"></span></div>
  </div>
  <div class="main">
    <aside class="left">
      <div class="tools">
        <input type="search" id="q" placeholder="代码 / 名称" autocomplete="off">
        <div class="chips" id="chips"></div>
      </div>
      <div class="tblwrap" id="tblwrap">
        <table class="wl" id="tbl"></table>
      </div>
    </aside>
    <section class="right">
      <div class="chartbox">
        <div class="chd">
          <div><span class="nm" id="cnm">—</span><span class="cd" id="ccd"></span></div>
          <span class="px" id="cpx">—</span>
          <span class="chg" id="cchg"></span>
          <span class="mfhint" id="mfhint">资金流：待接入</span>
          <div class="tog">
            <button type="button" id="btnDay" class="on">日线</button>
            <button type="button" id="btnWeek">周线</button>
          </div>
        </div>
        <div class="legend">
          <span><i style="background:#f5c84c"></i>MA5</span>
          <span><i style="background:#e879f9"></i>MA10</span>
          <span><i style="background:#38bdf8"></i>MA20</span>
          <span><i style="background:#e2e8f0"></i>MA60</span>
          <span id="ohlcWarn" class="warn" hidden>缺OHLC，已用收盘价折线</span>
        </div>
        <canvas id="cv"></canvas>
      </div>
      <div class="tabs">
        <div class="tabbar">
          <button type="button" class="on" data-tab="compare">今日对比</button>
          <button type="button" data-tab="acc">各家准确率</button>
          <button type="button" data-tab="note">备注</button>
        </div>
        <div class="tabpane" id="pane"></div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const SRC_COLOR = {Grok:'#2563eb',Muse:'#7c3aed','资金流':'#d97706','新思路':'#059669','老思路':'#64748b',J6:'#e11d48',H1:'#0891b2'};
let DATA=null, sel=null, sortKey='n_sources', sortDir=-1, filterSrc=null, q='', view='day', tab='compare';
let notesLocal={};
const LS='watch_board_notes_v1';
const KEYPFX='ashare_dash_key:';

const fmtPx = v => v==null||Number.isNaN(v)?'—':(Math.abs(v)>=100?v.toFixed(2):v.toFixed(2));
const fmtChg = v => v==null||Number.isNaN(v)?'—':((v>0?'+':'')+v.toFixed(2)+'%');
const fmtTurn = v => v==null||Number.isNaN(v)?'—':v.toFixed(2)+'%';
const clsChg = v => v==null||v===0?'flat':(v>0?'up':'down');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allRows(){ return (DATA.stocks||[]).concat(DATA.dropped||[]); }
function findStock(code){ return allRows().find(s=>s.ts_code===code); }
function notesOf(code){
  const loc=notesLocal[code], baked=(DATA.notes||{})[code];
  if(loc) return {tags: loc.tags||[], note: loc.note||''};
  if(baked) return {tags: baked.tags||[], note: baked.note||''};
  return {tags:[], note:''};
}
function saveNotes(){ try{ localStorage.setItem(LS, JSON.stringify(notesLocal)); }catch(e){} }

function visible(list){
  const s=q.trim().toLowerCase();
  return list.filter(r=>{
    if(filterSrc && !(r.sources||[]).includes(filterSrc)) return false;
    if(!s) return true;
    return (r.ts_code||'').toLowerCase().includes(s) || (r.name||'').toLowerCase().includes(s);
  });
}
function cmp(a,b,k){
  const av=a[k], bv=b[k];
  if(av==null && bv==null) return 0;
  if(av==null) return 1;
  if(bv==null) return -1;
  if(typeof av==='string') return av.localeCompare(bv,'zh');
  return av-bv;
}
function sorted(list){
  const arr=list.slice();
  arr.sort((a,b)=>{
    const t=cmp(a,b,sortKey)*sortDir;
    return t||a.ts_code.localeCompare(b.ts_code);
  });
  return arr;
}

function badges(srcs){
  return `<span class="badges">${(srcs||[]).map(s=>`<span class="bdg ${esc(s)}">${esc(s)}</span>`).join('')}</span>`;
}
function stHtml(r){
  if(r.status==='新进') return `<span class="st new">新</span>`;
  if(r.status==='连续') return `<span class="st cont">连${r.streak}</span>`;
  if(r.status==='掉出') return `<span class="st out">掉出</span>`;
  return '';
}
function rowHtml(r){
  const chg=r.pct_chg;
  return `<tr class="row ${r.status==='掉出'?'drop':''} ${sel===r.ts_code?'sel':''}" data-code="${esc(r.ts_code)}">
    <td class="l code">${esc((r.ts_code||'').split('.')[0])}</td>
    <td class="l name" title="${esc(r.name)}">${esc(r.name||'—')}</td>
    <td class="num ${clsChg(chg)}">${fmtPx(r.close)}</td>

function ma(arr, n){
  const out=new Array(arr.length).fill(null);
  let s=0,c=0;
  for(let i=0;i<arr.length;i++){
    const v=arr[i];
    if(v==null){out[i]=null;continue;}
    s+=v;c++;
    if(c>n){s-=arr[i-n];c--;}
    out[i]=c>=n?s/n:null;
  }
  return out;
}

function drawChart(){
  const cv=$('#cv'), st=findStock(sel);
  const ctx=cv.getContext('2d');
  const dpr=Math.max(1, window.devicePixelRatio||1);
  const w=cv.clientWidth||800, h=cv.clientHeight||360;
  cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!st){ ctx.fillStyle='#5c6678'; ctx.fillText('选择左侧一只股票查看走势', 20, 30); return; }
  const bars=(view==='week'?st.weekly:st.daily)||[];
  if(!bars.length){ ctx.fillStyle='#5c6678'; ctx.fillText('无行情数据', 20, 30); $('#ohlcWarn').hidden=true; return; }
  const missing=bars.some(b=>!b.ohlc);
  $('#ohlcWarn').hidden=!missing;

  const padL=58, padR=16, padT=10, padB=22;
  const hasMf=bars.some(b=>b.net_mf!=null);
  const plotH=h-padT-padB;
  const mfH=hasMf? Math.floor(plotH*0.14):0;
  const volH=Math.floor(plotH*0.22);
  const gap=8;
  const priceH=plotH-volH-mfH-gap-(hasMf?gap:0);
  const priceY=padT, volY=priceY+priceH+gap, mfY=volY+volH+gap;
  const plotW=w-padL-padR, n=bars.length;
  const slot=plotW/n;

  const closes=bars.map(b=>b.close);
  const ma5=ma(closes,5), ma10=ma(closes,10), ma20=ma(closes,20), ma60=ma(closes,60);
  let pmin=Infinity,pmax=-Infinity;
  bars.forEach((b,i)=>{
    const xs=[b.close,b.ohlc?b.high:null,b.ohlc?b.low:null,ma5[i],ma10[i],ma20[i],ma60[i]].filter(v=>v!=null);
    xs.forEach(v=>{pmin=Math.min(pmin,v);pmax=Math.max(pmax,v);});
  });
  if(!(pmax>pmin)){ pmin-=1; pmax+=1; }
  const pad=(pmax-pmin)*0.06||0.5; pmin-=pad; pmax+=pad;
  const yP=v=>priceY+priceH*(pmax-v)/(pmax-pmin);
  const xC=i=>padL+slot*i+slot/2;
  const vmax=Math.max(1, ...bars.map(b=>b.vol!=null?b.vol:(b.amount||0)));
  const useAmt=bars.every(b=>b.vol==null);
  const yV=v=>volY+volH-(v/vmax)*volH;
  const mfAbs=Math.max(1, ...bars.map(b=>Math.abs(b.net_mf||0)));
  const yM=v=>mfY+mfH/2-(v/mfAbs)*(mfH/2-2);

  // grid
  ctx.strokeStyle='#1b2230'; ctx.lineWidth=1; ctx.fillStyle='#6b7385'; ctx.font='11px '+getComputedStyle(document.body).fontFamily;
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const v=pmax-(pmax-pmin)*i/ticks, y=yP(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(fmtPx(v), padL-6, y);
  }
  ctx.fillStyle='#5c6678';
  const step=Math.max(1, Math.ceil(n/6));
  for(let i=0;i<n;i+=step){
    const d=bars[i].date, lab=d.slice(0,4)===(bars[n-1].date||'').slice(0,4)?d.slice(4,6)+'-'+d.slice(6):d.slice(0,4)+'-'+d.slice(4,6);
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(lab, xC(i), h-18);
  }

  // volume
  bars.forEach((b,i)=>{
    const v=b.vol!=null?b.vol:(b.amount||0);
    const up=b.pct_chg==null? (b.close>=(b.open??b.close)) : b.pct_chg>=0;
    ctx.fillStyle=up?'rgba(239,68,68,.55)':'rgba(18,185,129,.55)';
    const bw=Math.max(1, slot*0.62), x=xC(i)-bw/2, y=yV(v);
    ctx.fillRect(x,y,bw, volY+volH-y);
  });
  ctx.fillStyle='#5c6678'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(useAmt?'成交额':'成交量', padL+2, volY+2);

  if(hasMf){
    bars.forEach((b,i)=>{
      if(b.net_mf==null) return;
      const up=b.net_mf>=0;
      ctx.fillStyle=up?'rgba(239,68,68,.7)':'rgba(18,185,129,.7)';
      const bw=Math.max(1, slot*0.62), x=xC(i)-bw/2, y0=yM(0), y1=yM(b.net_mf);
      ctx.fillRect(x, Math.min(y0,y1), bw, Math.abs(y1-y0)||1);
    });
    ctx.fillStyle='#5c6678'; ctx.fillText('资金净流入', padL+2, mfY+2);
  }

  // candles / line
  const candleW=Math.max(3, Math.min(9, slot*0.7));
  let lineStarted=false;
  ctx.lineWidth=1.25; ctx.strokeStyle='#93c5fd';
  ctx.beginPath();
  bars.forEach((b,i)=>{
    if(b.ohlc && b.open!=null){
      const up=b.close>=b.open;
      ctx.strokeStyle=up?'#ef4444':'#12b981';
      ctx.fillStyle=up?'#ef4444':'#12b981';
      const x=xC(i);
      ctx.beginPath(); ctx.moveTo(x,yP(b.high)); ctx.lineTo(x,yP(b.low)); ctx.stroke();
      const top=yP(Math.max(b.open,b.close)), bot=yP(Math.min(b.open,b.close));
      const bh=Math.max(1, bot-top);
      if(up){ ctx.strokeRect(x-candleW/2, top, candleW, bh); }
      else { ctx.fillRect(x-candleW/2, top, candleW, bh); }
      lineStarted=false;
    }else if(b.close!=null){
      const x=xC(i), y=yP(b.close);
      if(!lineStarted){ ctx.beginPath(); ctx.strokeStyle='#93c5fd'; ctx.lineWidth=1.6; ctx.moveTo(x,y); lineStarted=true; }
      else ctx.lineTo(x,y);
      ctx.fillStyle='#93c5fd'; ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    }
  });
  if(lineStarted) ctx.stroke();

  function strokeMA(arr,color){
    ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1.15; let on=false;
    arr.forEach((v,i)=>{ if(v==null){on=false;return;} const x=xC(i),y=yP(v); if(!on){ctx.moveTo(x,y);on=true;} else ctx.lineTo(x,y); });
    ctx.stroke();
  }
  strokeMA(ma5,'#f5c84c'); strokeMA(ma10,'#e879f9'); strokeMA(ma20,'#38bdf8'); strokeMA(ma60,'#e2e8f0');

  // crosshair
  cv.onmousemove=ev=>{
    const r=cv.getBoundingClientRect();
    const x=ev.clientX-r.left, y=ev.clientY-r.top;
    if(x<padL||x>w-padR) return;
    const i=Math.max(0, Math.min(n-1, Math.floor((x-padL)/slot)));
    drawChart._hover=i;
    // redraw with overlay — to avoid recursion, paint overlay after a full draw would loop.
  };
  // simpler: use a second pass stored; attach once below
  if(!cv._bound){
    cv._bound=true;
    cv.addEventListener('mousemove', ev=>{
      const r=cv.getBoundingClientRect();
      const x=ev.clientX-r.left;
      const i=Math.max(0, Math.min(n-1, Math.floor((x-padL)/slot)));
      paintHover(i);
    });
    cv.addEventListener('mouseleave', ()=>drawChart());
  }
  function paintHover(i){
    drawChart._skipHover=true;
    // We need overlay; call inner without rebinding. Re-invoke drawChart would loop events. Do a lightweight overlay:
    // Easier: store last and redraw all then overlay. Temporarily unbind? Just redraw via requestAnimationFrame with hover index.
  }
  drawChart.hover=null;
}

// Rebuild drawChart with hover support more cleanly
function renderChart(){
  const cv=$('#cv'), st=findStock(sel);
  const ctx=cv.getContext('2d');
  const dpr=Math.max(1, window.devicePixelRatio||1);
  const w=cv.clientWidth||800, h=Math.max(220, cv.clientHeight||360);
  cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const layout=computeLayout(st,w,h);
  window.__chart=layout;
  if(!layout){ ctx.fillStyle='#5c6678'; ctx.font='13px sans-serif'; ctx.fillText(st?'无行情数据':'选择左侧一只股票查看走势', 24, 36); $('#ohlcWarn').hidden=true; return; }
  paintChart(ctx, layout, w, h, layout.hover);
}
function computeLayout(st,w,h){
  if(!st) return null;
  const bars=((view==='week'?st.weekly:st.daily)||[]).slice();
  if(!bars.length) return null;
  const missing=bars.some(b=>!b.ohlc);
  $('#ohlcWarn').hidden=!missing;
  const padL=58, padR=16, padT=8, padB=22;
  const hasMf=bars.some(b=>b.net_mf!=null);
  const plotH=h-padT-padB;
  const mfH=hasMf? Math.floor(plotH*0.14):0;
  const volH=Math.floor(plotH*0.22);
  const gap=8;
  const priceH=plotH-volH-mfH-gap-(hasMf?gap:0);
  const priceY=padT, volY=priceY+priceH+gap, mfY=volY+volH+gap;
  const plotW=w-padL-padR, n=bars.length, slot=plotW/Math.max(n,1);
  const closes=bars.map(b=>b.close);
  const mas={5:ma(closes,5),10:ma(closes,10),20:ma(closes,20),60:ma(closes,60)};
  let pmin=Infinity,pmax=-Infinity;
  bars.forEach((b,i)=>{
    [b.close, b.ohlc?b.high:null, b.ohlc?b.low:null, mas[5][i],mas[10][i],mas[20][i],mas[60][i]]
      .filter(v=>v!=null).forEach(v=>{pmin=Math.min(pmin,v);pmax=Math.max(pmax,v);});
  });
  if(!(pmax>pmin)){pmin-=1;pmax+=1;}
  const pad=(pmax-pmin)*0.06||0.5; pmin-=pad; pmax+=pad;
  const hasVol=bars.some(b=>b.vol!=null);
  const useAmt=!hasVol && bars.some(b=>b.amount!=null);
  const vOf=b=> hasVol ? (b.vol!=null?b.vol:0) : (useAmt?(b.amount||0):0);
  const vmax=Math.max(1,...bars.map(vOf));
  const mfAbs=Math.max(1,...bars.map(b=>Math.abs(b.net_mf||0)));
  return {st,bars,missing,hasMf,padL,padR,padT,padB,priceH,priceY,volY,volH,mfY,mfH,plotW,n,slot,mas,pmin,pmax,vmax,useAmt,hasVol,mfAbs,hover:null};
}
function paintChart(ctx, L, w, h, hover){
  const {bars,padL,padR,priceH,priceY,volY,volH,mfY,mfH,n,slot,mas,pmin,pmax,vmax,useAmt,hasVol,mfAbs,hasMf}=L;
  const yP=v=>priceY+priceH*(pmax-v)/(pmax-pmin);
  const xC=i=>padL+slot*i+slot/2;
  const vOf=b=> hasVol ? (b.vol!=null?b.vol:0) : (useAmt?(b.amount||0):0);
  const yV=v=>volY+volH-(v/vmax)*volH;
  const yM=v=>mfY+mfH/2-(v/mfAbs)*(mfH/2-2);
  ctx.strokeStyle='#1b2230'; ctx.lineWidth=1; ctx.font='11px sans-serif';
  for(let i=0;i<=5;i++){
    const v=pmax-(pmax-pmin)*i/5, y=yP(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle='#6b7385'; ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(fmtPx(v), padL-6, y);
  }
  const step=Math.max(1, Math.ceil(n/6));
  ctx.fillStyle='#5c6678';
  for(let i=0;i<n;i+=step){
    const d=bars[i].date, lab=d.slice(4,6)+'-'+d.slice(6);
    ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(lab, xC(i), h-18);
  }
  // 日历缺口（超过 7 天）画虚线，避免把中断画成连续行情
  const parseD=s=>Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6));
  for(let i=1;i<n;i++){
    const gap=(parseD(bars[i].date)-parseD(bars[i-1].date))/86400000;
    if(gap<=14) continue;
    const x=(xC(i-1)+xC(i))/2;
    ctx.strokeStyle='rgba(245,200,76,.45)'; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,priceY); ctx.lineTo(x, volY+volH); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#f5c84c'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font='10px sans-serif';
    ctx.fillText('资料中断', x, priceY+12); ctx.font='11px sans-serif';
  }
  bars.forEach((b,i)=>{
    const v=vOf(b); if(!v) return;
    const up=b.pct_chg==null? (b.close>=(b.open??b.close)) : b.pct_chg>=0;
    ctx.fillStyle=up?'rgba(239,68,68,.5)':'rgba(18,185,129,.5)';
    const bw=Math.max(1, slot*0.62), x=xC(i)-bw/2, y=yV(v);
    ctx.fillRect(x,y,bw, volY+volH-y);
  });
  ctx.fillStyle='#5c6678'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(useAmt?'成交额':'成交量', padL+2, volY+2);
  if(hasMf){
    bars.forEach((b,i)=>{
      if(b.net_mf==null) return;
      ctx.fillStyle=b.net_mf>=0?'rgba(239,68,68,.7)':'rgba(18,185,129,.7)';
      const bw=Math.max(1, slot*0.62), x=xC(i)-bw/2, y0=yM(0), y1=yM(b.net_mf);
      ctx.fillRect(x, Math.min(y0,y1), bw, Math.max(1,Math.abs(y1-y0)));
    });
    ctx.fillStyle='#5c6678'; ctx.fillText('资金净流入', padL+2, mfY+2);
  }
  const candleW=Math.max(3, Math.min(9, slot*0.7));
  // line segments for missing ohlc
  ctx.lineWidth=1.6; ctx.strokeStyle='#93c5fd'; ctx.beginPath();
  let on=false;
  bars.forEach((b,i)=>{
    if(b.ohlc && b.open!=null){ if(on) ctx.stroke(); on=false; return; }
    if(b.close==null){ on=false; return; }
    const x=xC(i), y=yP(b.close);
    if(!on){ ctx.beginPath(); ctx.moveTo(x,y); on=true; } else ctx.lineTo(x,y);
  });
  if(on) ctx.stroke();
  bars.forEach((b,i)=>{
    if(!(b.ohlc && b.open!=null)){
      if(b.close!=null){ ctx.fillStyle='#93c5fd'; ctx.beginPath(); ctx.arc(xC(i), yP(b.close), 2,0,Math.PI*2); ctx.fill(); }
      return;
    }
    const up=b.close>=b.open;
    ctx.strokeStyle=up?'#ef4444':'#12b981'; ctx.fillStyle=up?'#ef4444':'#12b981'; ctx.lineWidth=1;
    const x=xC(i);
    ctx.beginPath(); ctx.moveTo(x,yP(b.high)); ctx.lineTo(x,yP(b.low)); ctx.stroke();
    const top=yP(Math.max(b.open,b.close)), bot=yP(Math.min(b.open,b.close));
    const bh=Math.max(1, bot-top);
    if(up) ctx.strokeRect(x-candleW/2+.5, top, candleW, bh);
    else ctx.fillRect(x-candleW/2, top, candleW, bh);
  });
  const colors={5:'#f5c84c',10:'#e879f9',20:'#38bdf8',60:'#e2e8f0'};
  Object.keys(colors).forEach(k=>{
    ctx.beginPath(); ctx.strokeStyle=colors[k]; ctx.lineWidth=1.15; let s=false;
    mas[k].forEach((v,i)=>{ if(v==null){s=false;return;} const x=xC(i),y=yP(v); if(!s){ctx.moveTo(x,y);s=true;} else ctx.lineTo(x,y); });
    ctx.stroke();
  });
  if(hover!=null && bars[hover]){
    const i=hover, b=bars[i], x=xC(i);
    ctx.strokeStyle='rgba(226,232,240,.35)'; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(x,priceY); ctx.lineTo(x, h-22); ctx.stroke(); ctx.setLineDash([]);
    const boxW=210, boxH=hasMf?108:92;
    let bx=x+12, by=priceY+8;
    if(bx+boxW>w-padR) bx=x-boxW-12;
    ctx.fillStyle='rgba(10,14,20,.92)'; ctx.strokeStyle='#334155'; ctx.lineWidth=1;
    ctx.fillRect(bx,by,boxW,boxH); ctx.strokeRect(bx,by,boxW,boxH);
    ctx.font='11px monospace'; ctx.fillStyle='#e8edf5'; ctx.textAlign='left'; ctx.textBaseline='top';
    const d=b.date, ds=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);
    const lines=[
      ds+(b.ohlc?'  K线':'  收盘价'),
      b.ohlc?`开 ${fmtPx(b.open)}  高 ${fmtPx(b.high)}`:`收 ${fmtPx(b.close)}`,
      b.ohlc?`低 ${fmtPx(b.low)}  收 ${fmtPx(b.close)}`:'（当日缺 OHLC）',
      `涨跌 ${fmtChg(b.pct_chg)}  ${useAmt?'额':'量'} ${b.vol!=null?Math.round(b.vol):(b.amount!=null?b.amount.toFixed(0):'—')}`,
      `换手 ${fmtTurn(b.turnover)}`+(b.net_mf!=null?`  净流入 ${b.net_mf.toFixed(0)}`:''),
    ];
    lines.forEach((t,j)=>ctx.fillText(t, bx+8, by+6+j*16));
  }
}
function bindChart(){
  const cv=$('#cv');
  if(cv._ok) return;
  cv._ok=true;
  cv.addEventListener('mousemove', ev=>{
    const L=window.__chart; if(!L) return;
    const r=cv.getBoundingClientRect();
    const x=ev.clientX-r.left;
    if(x<L.padL||x>r.width-L.padR){ if(L.hover!=null){L.hover=null; renderChart();} return; }
    const i=Math.max(0, Math.min(L.n-1, Math.floor((x-L.padL)/L.slot)));
    if(L.hover!==i){ L.hover=i; const ctx=cv.getContext('2d');
      // use current css size
      const dpr=Math.max(1,window.devicePixelRatio||1);
      const w=cv.clientWidth, h=cv.clientHeight;
      cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      paintChart(ctx,L,w,h,i);
      window.__chart=L;
    }
  });
  cv.addEventListener('mouseleave', ()=>{ const L=window.__chart; if(L){L.hover=null; renderChart();} });
}
function drawChart(){ bindChart(); renderChart(); }

function itemLine(r){
  return `<div class="item" data-code="${esc(r.ts_code)}"><span class="c">${esc((r.ts_code||'').split('.')[0])}</span><span class="n">${esc(r.name||'')}</span>${badges(r.sources)}<span class="num ${clsChg(r.pct_chg)}" style="width:70px;text-align:right;font-family:var(--mono)">${fmtChg(r.pct_chg)}</span>${stHtml(r)}</div>`;
}
function renderCompare(){
  const c=DATA.compare||{};
  return `<div class="cols">
    <div class="col"><h3>新进<em>${(c.new||[]).length}</em></h3>${(c.new||[]).map(itemLine).join('')||'<div class="hint">无</div>'}</div>
    <div class="col"><h3>连续出现<em>${(c.cont||[]).length}</em></h3>${(c.cont||[]).map(r=>itemLine(r)).join('')||'<div class="hint">无</div>'}</div>
    <div class="col"><h3>掉出名单<em>${(c.out||[]).length}</em></h3>${(c.out||[]).map(itemLine).join('')||'<div class="hint">无</div>'}</div>
  </div>
  <div class="footnote">对比基准：上一名单日 ${esc(c.prev_date||'（无）')}。状态按合并后的观察名单（不按单家）计算。涨跌为名单日当日收盘涨跌幅。</div>`;
}
function renderAcc(){
  const a=DATA.accuracy||{};
  const rows=(a.cumulative||[]).map((r,i)=>{
    const hr=r.hit_rate==null?'—':(r.hit_rate*100).toFixed(1)+'%';
    return `<tr><td class="rank">${i+1}</td><td class="l">${esc(r.source)}</td><td>${r.n}</td><td>${r.hits}</td><td>${hr}</td><td class="${clsChg(r.avg_chg)}">${fmtChg(r.avg_chg)}</td></tr>`;
  }).join('');
  const y=(a.yesterday_rows||[]).map(r=>`<tr>
    <td class="l code">${esc(r.ts_code)}</td><td class="l">${esc(r.name||'')}</td>
    <td>${badges(r.sources)}</td><td class="${clsChg(r.pct_chg)}">${fmtChg(r.pct_chg)}</td></tr>`).join('');
  const last=a.last_rec_date?`${a.last_rec_date} 推荐 → ${a.last_eval_date} 实际涨跌`:'尚无下一交易日行情，暂无法计准确率';
  return `<div class="acc">
    <table><thead><tr><th></th><th class="l">来源</th><th>样本</th><th>命中</th><th>命中率</th><th>平均涨跌</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" class="l">暂无</td></tr>'}</tbody></table>
    <div class="yrows"><h3>最近一档：${esc(last)}</h3>
      <table><thead><tr><th class="l">代码</th><th class="l">名称</th><th>当时来源</th><th>次日涨跌</th></tr></thead>
      <tbody>${y||'<tr><td colspan="4" class="l">暂无</td></tr>'}</tbody></table>
    </div>
    <div class="footnote">${esc(a.rule||'')} 上表为累积（所有已能回看的名单日合计），按命中率、平均涨跌排序。</div>
  </div>`;
}
function renderNote(){
  const st=findStock(sel);
  if(!st) return '<div class="hint">先在左侧选一只股票。</div>';
  const n=notesOf(st.ts_code);
  const tags=n.tags.map((t,i)=>`<span class="tag">${esc(t)}<button type="button" data-i="${i}" title="删除">×</button></span>`).join('');
  return `<div class="note-head"><b>${esc(st.name||'')} ${esc(st.ts_code)}</b> ${stHtml(st)}</div>
    <div class="hint">来源理由：${st.reasons && Object.keys(st.reasons).length
      ? Object.entries(st.reasons).map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join('　')
      : '（无）'}</div>
    <div class="tags" id="tags">${tags||'<span class="hint">暂无标签</span>'}</div>
    <input id="tagin" placeholder="输入标签后回车，例如：日线突破、周线观察">
    <textarea id="notein" placeholder="写看法，用来积累日线 / 周线规律">${esc(n.note)}</textarea>
    <div class="note-actions">
      <button class="btn pri" id="btnSaveNote" type="button">保存到本机</button>
      <button class="btn" id="btnExp" type="button">导出备注 JSON</button>
      <button class="btn" id="btnImp" type="button">导入备注 JSON</button>
      <input id="impf" type="file" accept="application/json,.json" hidden>
    </div>
    <div class="hint">备注默认存在本机浏览器 localStorage。构建时若仓库里有 notes.json，会作为初始值合并进来（本机已有的记录优先）。可用导出文件交给维护者写回 notes.json。</div>`;
}
function renderPane(){
  const el=$('#pane');
  el.innerHTML = tab==='compare'?renderCompare(): tab==='acc'?renderAcc():renderNote();
  el.querySelectorAll('.item').forEach(n=>n.onclick=()=>select(n.dataset.code));
  if(tab==='note'){
    const st=findStock(sel); if(!st) return;
    const persist=()=>{
      notesLocal[st.ts_code]={ tags:[...$$('#tags .tag').map(t=>t.childNodes[0].textContent.trim())], note:$('#notein').value };
      saveNotes();
    };
    $('#tagin').onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); const v=$('#tagin').value.trim(); if(!v) return;
        const cur=notesOf(st.ts_code); if(!cur.tags.includes(v)) cur.tags.push(v);
        notesLocal[st.ts_code]=cur; saveNotes(); renderPane(); }
    };
    $$('#tags .tag button').forEach(b=>b.onclick=()=>{
      const cur=notesOf(st.ts_code); cur.tags.splice(+b.dataset.i,1);
      notesLocal[st.ts_code]=cur; saveNotes(); renderPane();
    });
    $('#notein').onchange=persist;
    $('#btnSaveNote').onclick=()=>{ persist(); $('#btnSaveNote').textContent='已保存'; setTimeout(()=>$('#btnSaveNote').textContent='保存到本机',1200); };
    $('#btnExp').onclick=()=>{
      const blob=new Blob([JSON.stringify(Object.assign({}, DATA.notes||{}, notesLocal), null, 2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='watch_board_notes.json'; a.click();
    };
    $('#btnImp').onclick=()=>$('#impf').click();
    $('#impf').onchange=ev=>{
      const f=ev.target.files&&ev.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{ try{
        const j=JSON.parse(rd.result); if(typeof j!=='object'||!j) throw 0;
        Object.keys(j).forEach(k=>{
          const v=j[k];
          notesLocal[k]= typeof v==='string'?{tags:[],note:v}:{tags:v.tags||[], note:v.note||''};
        });
        saveNotes(); renderPane();
      }catch(e){ alert('JSON 无法解析'); } };
      rd.readAsText(f);
    };
  }
}

function nav(dir){
  const list=sorted(visible(DATA.stocks||[])).concat(sorted(visible(DATA.dropped||[])));
  if(!list.length) return;
  const i=list.findIndex(s=>s.ts_code===sel);
  const j=i<0?0: Math.max(0, Math.min(list.length-1, i+dir));
  select(list[j].ts_code);
}

function start(d){
  DATA=d;
  try{ notesLocal=JSON.parse(localStorage.getItem(LS)||'{}')||{}; }catch(e){ notesLocal={}; }
  if(DATA.is_example) $('#banner').hidden=false;
  $('#asof').textContent=DATA.asof_label||DATA.asof;
  $('#nAll').textContent=DATA.counts.all;
  $('#nNew').textContent=DATA.counts.new;
  $('#nCont').textContent=DATA.counts.cont;
  $('#nOut').textContent=DATA.counts.out;
  const avg=DATA.list_avg_chg;
  const el=$('#avgChg'); el.textContent=fmtChg(avg); el.className=clsChg(avg);
  $('#gen').textContent='生成 '+ (DATA.generated||'');
  renderChips(); renderTable(); renderPane();
  const first=(DATA.stocks&&DATA.stocks[0])||(DATA.dropped&&DATA.dropped[0]);
  if(first) select(first.ts_code);
  $('#q').oninput=()=>{ q=$('#q').value; renderTable(); };
  $('#btnDay').onclick=()=>{ view='day'; $('#btnDay').classList.add('on'); $('#btnWeek').classList.remove('on'); drawChart(); };
  $('#btnWeek').onclick=()=>{ view='week'; $('#btnWeek').classList.add('on'); $('#btnDay').classList.remove('on'); drawChart(); };
  $$('.tabbar button').forEach(b=>b.onclick=()=>{
    tab=b.dataset.tab; $$('.tabbar button').forEach(x=>x.classList.toggle('on',x===b)); renderPane();
  });
  addEventListener('keydown', e=>{
    const tag=(e.target&&e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); nav(1); }
    if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); nav(-1); }
    if(e.key==='d'){ $('#btnDay').click(); }
    if(e.key==='w'){ $('#btnWeek').click(); }
  });
  addEventListener('resize', ()=>drawChart());
  $('.app').hidden=false;
}

// encrypted boot (same scheme as ashare-hot)
let ENC=null;
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt']);
}
function aadOf(E){return new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt)}
async function decryptBundle(key,E){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function encOk(E){try{
  if(!E||E.v!==2||E.alg!=='AES-256-GCM'||E.kdf!=='PBKDF2-SHA256')return false;
  if(!Number.isInteger(E.iter)||E.iter<100000||E.iter>2000000)return false;
  return b64d(E.salt).length===16&&b64d(E.iv).length===12&&b64d(E.ct).length>16;
}catch(e){return false}}
function lockUI(msg){ $('#lock').hidden=false; $('.app').hidden=true; $('#lke').textContent=msg||''; setTimeout(()=>{try{$('#lkp').focus()}catch(e){}},60); }
async function boot(){
  const emb=JSON.parse($('#embedded').textContent);
  if(emb&&emb.plain){ start(emb.plain); return; }
  if(!emb||!emb.enc){ lockUI('页面数据缺失'); return; }
  ENC=emb.enc; $('.app').hidden=true;
  if(!encOk(ENC)){ lockUI('页面数据校验失败，无法解锁。'); $('#lkb').disabled=true; $('#lkp').disabled=true; return; }
  if(!(window.crypto&&crypto.subtle)){ lockUI('当前浏览器不支持页面解密，请用 HTTPS 和新版浏览器打开'); $('#lkb').disabled=true; return; }
  const sk=KEYPFX+ENC.salt;
  let saved=null; try{saved=localStorage.getItem(sk)}catch(e){}
  if(saved){
    try{ const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']); start(await decryptBundle(key,ENC)); $('#lock').hidden=true; return; }
    catch(e){ try{localStorage.removeItem(sk)}catch(_){} lockUI('已记住的密钥已失效（密码可能已更换），请重新输入'); }
  } else lockUI('');
  $('#lkf').onsubmit=async ev=>{
    ev.preventDefault(); const inp=$('#lkp'), pw=inp.value, btn=$('#lkb');
    if(!pw){ $('#lke').textContent='请输入访问密码'; return; }
    btn.disabled=true; btn.textContent='解密中…'; $('#lke').textContent='';
    const rem=$('#lkr').checked; let d=null,key=null;
    try{ key=await pwKey(pw,ENC,rem); d=await decryptBundle(key,ENC); }catch(e){ d=null; }
    if(!d){ btn.disabled=false; btn.textContent='解锁'; $('#lke').textContent='密码错误，请重试'; inp.select(); return; }
    if(rem){ try{ localStorage.setItem(sk, b64e(await crypto.subtle.exportKey('raw', key))); }catch(e){} }
    inp.value=''; $('#lock').hidden=true; start(d);
  };
}
boot();
})();
