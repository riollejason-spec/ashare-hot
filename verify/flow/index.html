<script>(function(){
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[['ov','总览'],['hot','热点 Top20'],['am','早盘名单'],['pm','午后'],['review','复盘'],['history','历史'],['v33','V3.3'],['eve','晚间空跑'],['h1','H1']];
const MAINK={hot:'hot',am:'picks_am',pm:'picks_pm',review:'review',history:'history'};

let D=null,CUR=null;
const fmtYi=v=>v==null?'—':(v/1e8).toFixed(2)+' 亿',pct=(v,m)=>v==null?'—':(v*(m||1)).toFixed(2)+'%';
function mainSrc(){const M=D.main;if(!M.meta)return '<div class="src">来源：主看板数据文件不存在</div>';return '<div class="src">来源：'+esc(M.meta.file)+'（主看板例程生成，只读）· 文件时间 '+esc(M.meta.mtime)+' · 数据日 '+esc(M.meta.date)+' · sha256 '+esc(M.meta.sha256.slice(0,12))+'…</div>'}
function partTag(k){const p=(D.main.parts||{})[MAINK[k]];if(!p||!p.have)return '<span class="tag miss">今天未产出</span>';if(k!=='history'&&!p.today)return '<span class="tag miss">今天未产出</span>';return '<span class="tag ok">已产出</span>'}
function partLine(k){const p=(D.main.parts||{})[MAINK[k]];if(!p||!p.have)return '无数据';return (k==='history'?'':'数据日 '+esc(p.date)+' · ')+'生成 '+esc(p.at)}
function renderMain(k){const p=(D.main.parts||{})[MAINK[k]];let h='<section><h2>'+MNAME[k]+partTag(k)+'</h2>'+mainSrc()+'<div class="src">本块：'+partLine(k)+'</div>';
 if(!p||!p.have||(k!=='history'&&!p.today)){h+='<div class="none">今天未产出'+(p&&p.have?'（文件里是 '+esc(p.date)+' 的数据，不展示为今天）':'')+'</div></section>';$('#main').innerHTML=h;return}
 h+='<iframe id="mf" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="主看板内容"></iframe></section>';$('#main').innerHTML=h;
 const head='<base href="https://riollejason-spec.github.io/ashare-hot/" target="_blank"><style>#nav,nav{display:none!important}</style><script>window.__FLOW_TAB='+JSON.stringify(k)+';setInterval(function(){try{parent.postMessage({flowH:document.documentElement.scrollHeight},"*")}catch(e){}},500)<\/script>';
 const data=JSON.stringify(D.main.bundle).replace(/</g,'\\u003c');
 $('#mf').srcdoc=D.main_tpl.replace('<!--FLOW_HEAD-->',()=>head).replace('__DA'+'TA__',()=>data)}
addEventListener('message',e=>{const f=$('#mf');if(f&&e.source===f.contentWindow&&e.data&&e.data.flowH)f.style.height=Math.max(600,Math.min(e.data.flowH+20,20000))+'px'});
function v33(){const V=D.v33;return '<section><h2>V3.3 模拟盘<span class="tag end">'+esc(V.title)+'</span></h2><table class="kv">'+V.rows.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table><p class="dim">'+esc(V.note)+' 逐日明细见 <a href="../" style="color:#8fd8ff">V3.3 验证板</a>。</p><div class="src">来源：V3.3_最终报告_20261109.pdf 与 paper/v33_ledger.jsonl（终版，定格）</div></section>'}
function eve(){const E=D.evening,X=E.data;let h='<section><h2>晚间空跑名单<span class="tag ref">'+esc(E.tag)+'</span>';
 if(!X){return h+'<span class="tag miss">今天未产出</span></h2><div class="none">今天未产出</div></section>'}
 const isToday=X.date===D.today;h+=(isToday?'':'<span class="tag miss">今天未产出</span>')+'</h2><p class="dim">'+esc(E.note)+'</p>';
 h+='<div class="src">来源：'+esc(X.file)+' · 生成 '+esc(X.generated_at)+' · 状态 '+esc(X.status)+' · sha256 '+esc(X.sha256.slice(0,12))+'…（'+(X.sha_ok===true?'与 .sha256 一致':X.sha_ok===false?'与 .sha256 不一致':'无 .sha256')+'）'+(isToday?'':' · 以下是 '+esc(X.date)+' 的名单，不是今天的')+'</div>';
 h+='<div class="scroll"><table class="g"><tr><th>#</th><th>代码 名称</th><th class="num">成交额</th><th class="num">换手</th><th class="num">振幅</th><th class="num">涨跌</th><th class="num">r0 净流入</th><th class="num">r0 占比</th></tr>'+X.top.map(r=>'<tr><td>'+esc(r.rank)+'</td><td>'+esc(r.code)+' '+esc(r.name)+'</td><td class="num">'+fmtYi(r.amount)+'</td><td class="num">'+pct(r.turnover)+'</td><td class="num">'+pct(r.ampl,100)+'</td><td class="num">'+pct(r.chg_pct)+'</td><td class="num">'+fmtYi(r.r0_net)+'</td><td class="num">'+pct(r.r0_ratio,100)+'</td></tr>').join('')+'</table></div>';
 return h+'<div class="src">剔除 '+esc(X.excluded)+' 只（日 K 不足等）· 资金流缺 '+esc(X.flow_missing)+' 只</div></section>'}
function h1(){const H=D.h1;return '<section><h2>H1 交易部'+(H.trial?'<span class="tag trial">trial 试运行</span>':'')+'</h2><div class="src">来源：'+esc(H.source)+'<br>读取时间：'+esc(H.read_at)+'（北京时间）；status.md 最近提交 '+esc(H.commit)+'；sha256 '+esc(H.sha256.slice(0,12))+'…</div><pre>'+esc(H.raw)+'</pre></section>'}
function ov(){let rows=['hot','am','pm','review','history'].map(k=>'<tr><th>'+MNAME[k]+'</th><td>'+partTag(k)+'</td><td class="dim">'+partLine(k)+'</td></tr>').join('');
 const X=D.evening.data;rows+='<tr><th>晚间空跑名单</th><td>'+(X&&X.date===D.today?'<span class="tag ok">已产出</span>':'<span class="tag miss">今天未产出</span>')+'<span class="tag ref">参考，不入账</span></td><td class="dim">'+(X?'最近一份 '+esc(X.date)+' · 生成 '+esc(X.generated_at):'无数据')+'</td></tr>';
 rows+='<tr><th>V3.3</th><td><span class="tag end">V3.3 已结束</span></td><td class="dim">定格终版数字，不再更新</td></tr>';
 rows+='<tr><th>H1</th><td>'+(D.h1.trial?'<span class="tag trial">trial</span>':'')+'</td><td class="dim">转引 ops-hub status.md · 提交 '+esc(D.h1.commit)+'</td></tr>';
 return '<section><h2>总览</h2>'+mainSrc()+'<div class="scroll"><table class="g">'+rows+'</table></div></section>'+v33()+h1()}
function show(t){CUR=t;document.querySelectorAll('#nav span').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(MAINK[t])return renderMain(t);$('#main').innerHTML=t==='ov'?ov():t==='v33'?v33():t==='eve'?eve():h1();window.scrollTo(0,0)}
function start(d){D=d;$('#gen').textContent='生成：'+d.generated_at+'（北京时间）· 只读转引各例程已生成的文件，不重算';
 $('#nav').innerHTML=TABS.map(t=>'<span data-t="'+t[0]+'">'+t[1]+'</span>').join('')+'<i class="sp"></i><a href="../" target="_blank">V3.3 验证板 ↗</a><a href="../../brain/" target="_blank">资金流大脑 ↗</a>';
 document.querySelectorAll('#nav span').forEach(b=>b.onclick=()=>show(b.dataset.t));show('ov')}
let ENC=null;const KEYPFX='ashare_dash_key:';const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt'])}
const aadOf=E=>new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt);
async function dec(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockUI(m){$('.wrap').hidden=true;$('#lock').hidden=false;$('#lke').textContent=m||''}
function unlocked(d){$('#lock').hidden=true;$('.wrap').hidden=false;if(ENC){$('#lockb').hidden=false;$('#lockb').onclick=()=>{try{localStorage.removeItem(KEYPFX+ENC.salt)}catch(e){}location.reload()}}start(d)}
async function boot(){const emb=JSON.parse($('#embedded').textContent);if(emb.plain){unlocked(emb.plain);return}ENC=emb.enc;
 if(!(window.crypto&&crypto.subtle)){lockUI('当前浏览器不支持页面解密');return}const sk=KEYPFX+ENC.salt;let saved=null;try{saved=localStorage.getItem(sk)}catch(e){}
 if(saved){try{const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);unlocked(await dec(key,ENC));return}catch(e){try{localStorage.removeItem(sk)}catch(_){}lockUI('已记住的密钥已失效，请重新输入')}}else lockUI('');
 $('#lkf').onsubmit=async ev=>{ev.preventDefault();const pw=$('#lkp').value,btn=$('#lkb');if(!pw){$('#lke').textContent='请输入访问密码';return}btn.disabled=true;btn.textContent='解密中…';const rem=$('#lkr').checked;let d=null,key=null;
  try{key=await pwKey(pw,ENC,rem);d=await dec(key,ENC)}catch(e){d=null}if(!d){btn.disabled=false;btn.textContent='解锁';$('#lke').textContent='密码错误，请重试';return}
  if(rem){try{localStorage.setItem(sk,b64e(await crypto.subtle.exportKey('raw',key)))}catch(e){}}$('#lkp').value='';unlocked(d)}}
boot();})();</script></body></html>
