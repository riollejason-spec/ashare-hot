<title>资金海洋 · A股15支实时资金</title>
<style>
:root{--bg:#03182f;--bg2:#05264a;--card:#052a4bd9;--line:#14507a;--ink:#eaf8ff;--dim:#93bcd3;--sky:#7fe7f2;--sky2:#2fc3dc;--up:#ff5a5f;--down:#2bd47d;--gold:#ffd166;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[hidden]{display:none!important}*{box-sizing:border-box}html{background:linear-gradient(180deg,#0b4f7c 0%,#06325a 22%,#03203f 55%,#010d1f 100%) fixed,var(--bg)}html,body{margin:0;color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--sky)}
.wrap{max-width:1280px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:13px;color:var(--sky);background:#06315acc}
h1{margin:0;font-size:19px;letter-spacing:.02em;text-shadow:0 0 16px #2fc3dcaa}h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.sp{flex:1}
.lbtn{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lbtn button{background:none;border:0;color:var(--dim);padding:5px 11px;font-size:13px;cursor:pointer}.lbtn button.on{background:linear-gradient(180deg,#1a8fb8,#0c5f8c);color:#fff}.lbtn button:disabled{opacity:.4;cursor:default}
.lockb{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 4px;font-size:12.5px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#0b2245;font-family:var(--mono);font-size:12px;background:#06315acc}
.pill i{width:8px;height:8px;border-radius:50%;background:#567}.pill.live i{background:var(--sky);box-shadow:0 0 8px var(--sky);animation:bl 1.4s infinite}.pill.warn{border-color:#a07a1f;color:var(--gold)}.pill.warn i{background:var(--gold)}.pill.bad{border-color:#8a2b2b;color:#ff9a9a}.pill.bad i{background:var(--up)}
@keyframes bl{50%{opacity:.35}}
.warnbar{display:none;margin:6px 0;padding:7px 10px;border:1px solid #a07a1f;border-radius:8px;background:#2a2108aa;color:var(--gold);font-size:12.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 1px #021a33,0 10px 40px #0009,inset 0 1px 0 #7fe7f21f;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}.ph b{color:var(--ink);font-size:14px}
#brainBox{position:relative}
#brain{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px 10px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tip{position:absolute;pointer-events:none;background:#03203fee;border:1px solid var(--sky2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);display:none;box-shadow:0 0 18px #2fc3dc55}
.counts{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.cnt{flex:1;min-width:84px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#041f3a}
.cnt b{display:block;font-family:var(--mono);font-size:18px}.cnt small{color:var(--dim);font-size:11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#062d52;color:var(--dim);font-weight:500;font-size:11.5px;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid #0f3d60;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
table.t th:nth-child(2),table.t td:nth-child(2){text-align:left}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover,table.t tbody tr.sel{background:#0b4a73}
td .nm{font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;color:var(--ink)}td small{display:block;color:var(--dim);font-size:11px}
.u{color:var(--up)}.d{color:var(--down)}.z{color:var(--dim)}
.sc{display:inline-flex;align-items:center;gap:6px}.sc .bar{width:44px;height:6px;border-radius:3px;background:#0d3a5c;overflow:hidden}.sc .bar i{display:block;height:100%}
.band{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-family:-apple-system,"PingFang SC",sans-serif}
.b1{background:#ffd16622;color:var(--gold);border:1px solid #ffd16688}.b2{background:#5cc4ff1f;color:var(--sky);border:1px solid #5cc4ff77}.b3{background:#8899aa1f;color:#9fb0c3;border:1px solid #8899aa66}
.why1{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;color:var(--dim);white-space:normal;text-align:left;max-width:260px;margin-top:2px}
.tbl{max-height:640px;overflow:auto}
.formula{margin-top:14px;padding:12px 14px;font-size:13px;color:#c4e2f0}
.formula h3{margin:0 0 6px;font-size:14px;color:var(--ink)}.formula li{margin:3px 0}.formula code{font-family:var(--mono);color:var(--sky);font-size:12px}
.disc{margin-top:10px;font-size:12px;color:var(--dim)}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:#010c1cb8;backdrop-filter:blur(3px)}
.sheet.on{display:flex;align-items:center;justify-content:center}
.sbox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0a3a63,#041d38 60%,#03162c);border:1px solid var(--sky2);border-radius:16px;box-shadow:0 0 40px #2fc3dc44;padding:14px 16px 18px;position:relative}
.sx{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
.sh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-right:30px}.sh h2{margin:0;font-size:20px}.sh .meta{color:var(--dim);font-size:12.5px}
.big{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.kv div{background:#041f3a;border:1px solid var(--line);border-radius:8px;padding:5px 7px}.kv small{display:block;color:var(--dim);font-size:11px}.kv b{font-family:var(--mono);font-size:14px}
.verdict{margin:10px 0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#041f3a;font-size:13.5px}
.parts{margin:6px 0}.pt{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #154a6e;font-size:12.5px}
.pt .pb{height:7px;background:#0d3a5c;border-radius:4px;overflow:hidden}.pt .pb i{display:block;height:100%;background:linear-gradient(90deg,#1fa3cf,#7fe7f2)}
.pt .ev{grid-column:1/-1;color:var(--dim);font-size:12px;margin-top:-2px}.pt .v{font-family:var(--mono);text-align:right}
.ded{color:#ff9a9a;font-size:12.5px;margin:3px 0}
h4{margin:14px 0 6px;font-size:13.5px;color:var(--sky)}
#chart{width:100%;height:200px;display:block;background:#031a31;border:1px solid var(--line);border-radius:10px}
.hotl{font-size:12.5px;margin:3px 0;color:#c4e2f0}
/* 9:29 竞价参考分（仅展示） */
.aref{margin-top:8px;padding:0;font-size:13px;color:#c4e2f0}
.aref summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.aref summary::-webkit-details-marker{display:none}
.aref summary b{color:var(--ink);font-size:14px}.aref summary .tg{font-size:11.5px;color:var(--dim)}
.aref .ab{padding:0 12px 10px}.aref .note{font-size:11.5px;color:var(--dim);margin:4px 0 6px}
.miss{color:var(--gold)}.showm{display:none}td small.showm{white-space:normal;max-width:150px}td.ml{white-space:normal;text-align:left;font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;max-width:160px}
/* lock */
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.lk{width:min(360px,92vw);text-align:center;background:#05284acc;border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 0 40px #2fc3dc33}
.lk-orb{font-size:46px;filter:drop-shadow(0 0 14px #2fc3dc)}.lk h2{margin:6px 0 2px;font-size:18px}.lk p{margin:0 0 14px;color:var(--dim);font-size:13px}
.lk input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#03182f;color:var(--ink);font-size:16px}
.lk button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#0c6f9e,#22b5d2);color:#fff;font-size:15px;cursor:pointer}
.lk label{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin-top:10px;font-size:13px;color:var(--dim)}
.lke{min-height:20px;margin-top:8px;color:#ff9a9a;font-size:13px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.tbl{max-height:none}.why1{max-width:150px}}
@media (max-width:520px){.wrap{padding-left:8px;padding-right:8px}h1{font-size:17px}h1 small{display:block;margin:0}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}table.t td,table.t th{padding:7px 4px}.hidem{display:none}td small.showm{display:block}.pt{grid-template-columns:84px 1fr 52px}}

.legend i.lw{width:16px;height:10px;border-radius:3px}.legend i.lw.in{background:linear-gradient(180deg,#6fe6f2,#1fa3cf 45%,#0a4f86);box-shadow:inset 0 2px 0 #f0ffff}.legend i.lw.out{background:linear-gradient(180deg,#1f5674,#071e33)}

  window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej(new Error('jsonp error'))};s.src=url+(url.indexOf('?')>=0?'&':'?')+'cb='+cb;document.head.appendChild(s)})}

    if(!canFetch())throw new Error('outside session');
    try{const d=await emOnce(EM_HOST+path+(path.indexOf('?')>=0?'&':'?')+'_='+Date.now());if(d&&d.data)return d.data;throw new Error('empty')}finally{EMLAST=Date.now()}};
  const p=EMQ.then(run,run);EMQ=p.catch(()=>{});return p}

  let txok=false;try{const ts=await tencent(P);QTIME=ts||QTIME;LASTOK=Date.now();txok=true;P.forEach(p=>{const q=Q[p.code];if(q&&q._name)p.displayName=q._name})}catch(e){}

      (d.diff||[]).forEach(r=>{const o={};QF.split(',').forEach(k=>{if(r[k]!==undefined)o[k]=r[k]});Q[r.f12]=Object.assign({},Q[r.f12]||{},o);ts=Math.max(ts,num(r.f124)||0)});
      FTIME=ts||FTIME;emok=true;EMBACK=0;FAILS=0}catch(e){emFail()}
    if(emok){const need=P.filter(p=>!K[p.code]).concat(P);const done={};let n=0;
      for(let j=0;j<need.length&&n<K_PER_TICK;j++){const p=j<need.length-P.length?need[j]:P[(KRR++)%P.length];if(done[p.code])continue;done[p.code]=1;

  SRC=!txok?'fail':(emok?'live':'tx');refresh()}

// (ST 10% since 2026-07-06). New stocks on no-limit days (name starts with N or C) → null: never judged limit-up / limit-down.
function limitPct(p){const c=String(p.code);if(/^[NC]/.test(String(p.name||'').trim()))return null;if(/^(300|301|688|689)/.test(c))return 20;if(/^(8|4|92)/.test(c))return 30;return 10}

  if(hit(item.bull))return[1,'利好'];if(hit(item.bear))return[0,'利空'];if(item.sentiment==='bull')return[1,'利好'];if(item.sentiment==='bear')return[.2,'利空'];return[.6,'多空交织']}

    const r=abs?delta/abs:0;C=7.5*(1+r);cev='近'+n+'分钟主力净流入 '+amt(delta)+'，方向一致度 '+(r*100).toFixed(0)+'%（持续流入→满分，持续流出→0）'}

function drawChart(k){const cv=$('#chart');if(!cv)return;const dpr=Math.min(2,devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);

  g.strokeStyle='#1d3a66';g.lineWidth=1;[mn+pad,0,mx-pad].forEach(v=>{g.beginPath();g.moveTo(pl,Y(v));g.lineTo(W-pr,Y(v));g.stroke();g.fillText(amt(v),2,Y(v)+4)});

  const last=k[k.length-1];g.fillStyle=last.main>=0?'#ff5a5f':'#2bd47d';g.font='bold 12px sans-serif';g.fillText('主力 '+amt(last.main)+' @'+last.t,pl+6,pt+12)}

// ---------- ocean canvas（资金海洋：每支一格海面；涨潮=主力净流入，退潮=主力净流出） ----------
// 浪高/水位 = 净流入规模（相对 15 支里最大的 |主力净流入|），浪速 = 主力净占比；退潮时水位低于平潮线、海面变暗变平静。
const cv=$('#brain'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,tiles=[],anim=null,lastT=0,visible=true,hover=null;
const COLS=5,GAP=6;
function layout(){const r=cv.parentElement.getBoundingClientRect();W=Math.max(300,r.width);DPR=Math.min(2,devicePixelRatio||1);
  const rows=Math.max(1,Math.ceil(picks().length/COLS)),tw=(W-GAP*(COLS+1))/COLS,th=W<520?Math.max(104,tw*1.45):clamp(tw*1.15,118,170);
  H=Math.round(GAP+rows*(th+GAP));cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+'px';buildGraph(tw,th)}
function buildGraph(tw,th){const P=picks().slice().sort((a,b)=>a.rank-b.rank);
  tiles=P.map((p,i)=>({p,x:GAP+(i%COLS)*(tw+GAP),y:GAP+Math.floor(i/COLS)*(th+GAP),w:tw,h:th,ph:i*1.37}))}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(s,maxW,px,weight){let f=px;ctx.font=(weight||'')+' '+f+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  while(f>8&&ctx.measureText(s).width>maxW){f-=.5;ctx.font=(weight||'')+' '+f+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'}return f}
function wave(o,lvl,amp,len,ph,bot){const k=2*Math.PI/len;ctx.beginPath();ctx.moveTo(o.x,bot);
  for(let x=0;x<=o.w+3;x+=3){const X=o.x+Math.min(x,o.w);ctx.lineTo(X,lvl+Math.sin(x*k+ph)*amp+Math.sin(x*k*2.3+ph*1.6)*amp*.3)}ctx.lineTo(o.x+o.w,bot);ctx.closePath()}
function crest(o,lvl,amp,len,ph){const k=2*Math.PI/len;ctx.beginPath();
  for(let x=0;x<=o.w+3;x+=3){const X=o.x+Math.min(x,o.w),Y=lvl+Math.sin(x*k+ph)*amp+Math.sin(x*k*2.3+ph*1.6)*amp*.3;x?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}}
function drawTile(o,tm,mx){const q=Q[o.p.code]||{},f=num(q.f62),r=num(q.f184),s=SCORES[o.p.code]||scoreOf(o.p),B=BAND[s.band],small=W<520;
  const mag=f==null?0:Math.sqrt(Math.abs(f)/mx),dir=f==null?0:f>=0?1:-1,ri=Math.min(1,Math.abs(r||0)/10);
  const top=o.y+(small?33:40),bot=o.y+o.h-(small?17:20),sea=top+(bot-top)*.55,lvl=sea-dir*mag*(bot-top)*(dir>0?.42:.38);
  const amp=dir>0?1.6+mag*(small?5.5:8)*(.6+.4*ri):dir<0?.8+mag*1.2:.6,len=o.w*(dir>0?.62:1.1),sp=dir>0?.9+2.2*ri:dir<0?.35:.25,ph=tm*sp*2+o.ph;
  ctx.save();rr(o.x,o.y,o.w,o.h,10);ctx.clip();
  const sky=ctx.createLinearGradient(0,o.y,0,o.y+o.h);sky.addColorStop(0,dir<0?'#06192d':'#0a2c4c');sky.addColorStop(1,'#041427');ctx.fillStyle=sky;ctx.fillRect(o.x,o.y,o.w,o.h);
  // back swell
  wave(o,lvl-amp*.5-2,amp*.8,len*1.3,ph*.7+1.9,bot);ctx.fillStyle=dir>0?'rgba(70,200,230,.32)':dir<0?'rgba(30,80,110,.35)':'rgba(70,100,130,.28)';ctx.fill();
  // front water
  wave(o,lvl,amp,len,ph,bot);const wg=ctx.createLinearGradient(0,lvl-amp,0,bot);
  if(dir>0){wg.addColorStop(0,'#6fe6f2');wg.addColorStop(.35,'#1fa3cf');wg.addColorStop(1,'#0a4f86')}
  else if(dir<0){wg.addColorStop(0,'#1f5674');wg.addColorStop(1,'#071e33')}else{wg.addColorStop(0,'#3a5874');wg.addColorStop(1,'#122a40')}
  ctx.fillStyle=wg;ctx.fill();
  if(dir>0){crest(o,lvl,amp,len,ph);ctx.strokeStyle='rgba(240,255,255,'+(.55+.4*mag)+')';ctx.lineWidth=1.4+mag;ctx.stroke();
    if(!RM&&mag>.35){for(let j=0;j<3;j++){const u=((tm*(.25+.15*j)*sp+j*.37+o.ph)%1),sx=o.x+o.w*((j*.33+.15+tm*.05*sp)%1);ctx.fillStyle='rgba(235,255,255,'+(.7*(1-u))+')';ctx.beginPath();ctx.arc(sx,lvl-amp-2-u*10*mag,1.2+mag*.8,0,7);ctx.fill()}}}
  else if(dir<0){crest(o,lvl,amp,len,ph);ctx.strokeStyle='rgba(140,190,215,.35)';ctx.lineWidth=1;ctx.stroke()}
  // 平潮线
  ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(190,235,255,.38)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(o.x+3,sea);ctx.lineTo(o.x+o.w-3,sea);ctx.stroke();ctx.setLineDash([]);
  // bottom strip: score
  ctx.fillStyle='rgba(2,12,26,.82)';ctx.fillRect(o.x,bot,o.w,o.y+o.h-bot);
  ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(o.x,o.y+o.h-3,o.w,3);ctx.fillStyle=B[2];ctx.fillRect(o.x,o.y+o.h-3,o.w*clamp(s.total,0,100)/100,3);
  ctx.restore();
  // text (high contrast, outside clip)
  ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=3;
  const dn=dispName(o.p);fitText(dn,o.w-10,small?11:13,'600');ctx.fillStyle='#f2fbff';ctx.fillText(dn,o.x+5,o.y+(small?14:17));
  ctx.font=(small?9.5:11)+'px '+MONO;const at=(dir>0?'▲':dir<0?'▼':'')+amt(f);ctx.fillStyle=f==null?'#9fb0c3':f>=0?'#ff9da0':'#7ff0b0';
  ctx.fillText(at,o.x+5,o.y+(small?27:32));if(!small&&r!=null){ctx.textAlign='right';ctx.fillStyle='#bfe3f2';ctx.fillText(pct(r),o.x+o.w-5,o.y+32)}
  ctx.textAlign='left';ctx.font='700 '+(small?11:12.5)+'px '+MONO;ctx.fillStyle=B[2];ctx.fillText(String(s.total),o.x+5,o.y+o.h-(small?5:6));
  ctx.textAlign='right';ctx.font=(small?9:11)+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle=B[2];ctx.fillText(small?B[0].slice(0,2):B[0],o.x+o.w-5,o.y+o.h-(small?5:6));

let MONO='monospace';
function draw(t){anim=null;if(!W||!tiles.length)return;lastT=t;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  const mx=Math.max(1,...tiles.map(o=>Math.abs(num((Q[o.p.code]||{}).f62)||0))),tm=RM?0:t/1000;

new IntersectionObserver(es=>{visible=es[0].isIntersecting;kick()}).observe(cv);document.addEventListener('visibilitychange',kick);

function formulaHTML(){return'<h3>评分公式（满分100，浏览器内按实时数据重算，全部规则公开）</h3><ol>'
 +'<li><b>主力净占比 25分</b>：<code>clamp((净占比%+10)/20,0,1)×25</code>，-10%→0、0→12.5、+10%以上→25。</li>'
 +'<li><b>主力净流入额 15分</b>：<code>7.5×(1+sign·min(1,log10(1+|额|/100万)/log10(301)))</code>，±3亿封顶。</li>'
 +'<li><b>资金趋势 15分</b>：近15分钟主力累计净流入变化 ÷ 同期每分钟变化绝对值之和 = 方向一致度 r，<code>7.5×(1+r)</code>。</li>'
 +'<li><b>涨跌与换手 15分</b>：涨跌 <code>clamp((涨跌%+5)/10,0,1)×10</code>；换手 2–15% 得5、1–25% 得3、其余1。</li>'

  if(S&&S.days_evaluated){h+='<div class="counts" style="padding:8px 0"><div class="cnt"><b>'+S.days_evaluated+'</b><small>已评估天数</small></div><div class="cnt"><b>'+(S.high_win_rate==null?'—':(S.high_win_rate*100).toFixed(0)+'%')+'</b><small>高分组跑赢低分组</small></div><div class="cnt"><b class="'+cls(S.avg_spread_pp)+'">'+(S.avg_spread_pp==null?'—':sg(S.avg_spread_pp)+S.avg_spread_pp.toFixed(2)+'pp')+'</b><small>平均高低差</small></div><div class="cnt"><b class="'+cls(S.avg_all15_net_pct)+'">'+pct(S.avg_all15_net_pct)+'</b><small>全15支平均净收益</small></div><div class="cnt"><b class="'+cls(S.cum_all15_net_pct)+'">'+pct(S.cum_all15_net_pct)+'</b><small>全15支累计净收益</small></div></div>'
    +'<div style="overflow:auto"><table class="t"><thead><tr><th>日期</th><th>次日</th><th>高分组</th><th>低分组</th><th>高-低</th><th>全15净</th></tr></thead><tbody>'
    +S.days.slice().reverse().map(r=>'<tr><td>'+esc(r.date)+(r.mode==='backfill'?'<small>回补</small>':'')+'</td><td style="text-align:left">'+esc(r.next)+'</td><td class="'+cls(r.high_avg)+'">'+pct(r.high_avg)+'<small>n='+r.high_n+'</small></td><td class="'+cls(r.low_avg)+'">'+pct(r.low_avg)+'<small>n='+r.low_n+'</small></td><td class="'+cls(r.spread_pp)+'">'+(r.spread_pp==null?'—':sg(r.spread_pp)+r.spread_pp.toFixed(2))+'</td><td class="'+cls(r.all15_net)+'">'+pct(r.all15_net)+'</td></tr>').join('')+'</tbody></table></div>'}
  else h+='<div class="z" style="margin-top:6px">累计跟踪：次一交易日开盘后开始出结果。</div>';
  return h+'<div class="disc">指标1：10:00 冻结价→次一交易日开盘价，高分组(≥75)与低分组(&lt;45)等权平均（涨停买不进/跌停卖不出的剔除）。指标2：全部15支 当日9:30开盘→次日开盘，扣佣金买卖各0.01%、印花税卖出0.05%（悲观再加每边0.2%滑点）。冻结记录写入私有仓库并进入哈希链账本。</div>'}
// ---------- 9:29 竞价参考分（仅展示：不进 10:00 定格、不参与 V3.3 买卖和验证统计） ----------
let AREF=null;const AREFS={};
function arefCell(p){if(LIST!=='am'||!AREF||AREF.status!=='shown')return'';const r=AREFS[p.code];if(!r)return'';return'<small title="'+esc(AREF.label)+'">竞价参考 '+(r.score==null?'<span class="miss">—</span>':r.score)+'</small>'}
function arefGot(r){return(r.parts||[]).filter(x=>!x.missing).map(x=>x.l+' '+(+x.pts).toFixed(1)+'/'+x.max).join('、')}
function arefDetail(p){if(LIST!=='am'||!AREF||AREF.status!=='shown')return'';const r=AREFS[p.code];if(!r)return'';
  return'<div class="hotl">'+esc(AREF.label)+'：'+(r.score==null?'<b class="miss">不出总分</b>（'+esc(r.withheld||'资金流缺失')+'）；已取得分项：'+esc(arefGot(r)||'无'):'<b>'+r.score+' 分 · '+esc(r.band_label)+'</b>')
   +'（计算于 '+esc(AREF.computed_at.slice(11,19))+'，行情来源 '+esc(r.source)+'）'+(r.missing.length?'；<span class="miss">缺失：'+esc(r.missing.join('、'))+'</span>':'')+'。仅作参考展示，不进 10:00 定格，不影响买卖；上面是实时评分。</div>'}
function arefHTML(){const A=AREF;if(!A)return'';
  if(A.status!=='shown'){const t={skipped_deadline:'今日竞价参考分未能在 '+(A.deadline||'09:29:30')+' 前生成，已跳过（不显示分数）。',withdrawn:'今日竞价参考分晚于 '+(A.deadline||'09:29:30')+' 才推上看板，已撤下（不显示分数）。',not_displayed:'今日竞价参考分未能在 '+(A.deadline||'09:29:30')+' 前推上看板，已跳过（不显示分数）。',skipped_conflict:'今日竞价参考分因看板正在发布、为避免同时推送已跳过（不显示分数）。',bad_hash:'竞价参考分存档校验失败（SHA-256 不一致），不显示。'}[A.status]||'竞价参考分不可用。';
    return'<summary><b>竞价参考分</b><span class="tg">'+esc(t)+(A.why?' '+esc(A.why):'')+'</span></summary>'}
  let b1=0,b2=0,b3=0,nw=0;A.stocks.forEach(s=>{if(s.score==null){nw++;return}s.band===1?b1++:s.band===2?b2++:b3++});
  const rows=A.stocks.slice().sort((x,y)=>((y.score??-1)-(x.score??-1))||(x.rank-y.rank));const B=x=>BAND[x];
  return'<summary><b>📌 '+esc(A.label)+'</b><span class="tg">计算于 '+esc(A.computed_at.slice(11,19))+' · 建仓 '+b1+' · 观察 '+b2+' · 不推荐 '+b3+(nw?' · <span class="miss">'+nw+' 支资金流缺失，不出总分</span>':'')+' · 点开看明细</span></summary>'
   +'<div class="ab"><div class="note">早盘名单，公式 '+esc(A.formula)+'（权重、阈值、扣分项与实时评分相同），数据截至集合竞价'+(A.data_time?'（行情时间 '+esc(A.data_time.slice(11,19))+'）':'')+'；资金流来源：'+esc(A.flow)+'。任一资金流项（主力净占比、主力净流入额、资金趋势）缺失的不出总分，只列已取得的分项，缺失项标「缺失」，不补零、不估算。<b>仅作参考展示</b>：不进 10:00 定格，不参与 V3.3 买卖和验证统计；9:30 开盘后上面的实时评分照常变化。</div>'
   +'<div class="note"><b>开盘前没有当天资金趋势数据，多数股票只列分项、不出总分，这是正常情况。</b></div>'
   +'<div style="overflow:auto"><table class="t"><thead><tr><th>#</th><th>股票</th><th>竞价涨幅</th><th>主力净流入</th><th>参考分</th><th class="hidem">已取得分项</th></tr></thead><tbody>'
   +rows.map((s,i)=>{const got=arefGot(s),ms=s.missing.map(m=>m.replace(/（.*/,'')).join('、');
     return'<tr data-c="'+esc(s.code)+'"><td class="z">'+(i+1)+'</td><td><span class="nm">'+esc(dispName(s))+'</span><small>'+esc(s.code)+' · '+esc(s.source.split('（')[0])+'</small>'+(s.score==null?'<small class="showm">已得：'+esc(got||'无')+'</small>':'')+(ms?'<small class="miss showm">缺失：'+esc(ms)+'</small>':'')+'</td>'
      +'<td class="'+cls(s.chg_pct)+'">'+pct(s.chg_pct)+'</td><td class="'+(s.main_net==null?'miss':cls(s.main_net))+'">'+(s.main_net==null?'缺失':amt(s.main_net))+'</td>'
      +'<td>'+(s.score==null?'<b class="miss">—</b><small class="miss">不出总分</small>':'<b style="color:'+B(s.band)[2]+'">'+s.score+'</b> <span class="band '+B(s.band)[1]+'">'+esc(s.band_label)+'</span>')+'</td>'
      +'<td class="ml hidem">'+(s.score==null?esc(got||'无'):'—')+(ms?'<br><span class="miss">缺失：'+esc(ms)+'</span>':'')+'</td></tr>'}).join('')
   +'</tbody></table></div><div class="note" style="font-family:var(--mono);word-break:break-all">存档 SHA-256 '+esc(A.sha256)+'</div></div>'}
function renderAref(){const el=$('#aref');AREF=D.auction_ref||null;Object.keys(AREFS).forEach(k=>delete AREFS[k]);
  if(!AREF){el.hidden=true;return}(AREF.stocks||[]).forEach(s=>AREFS[s.code]=s);el.innerHTML=arefHTML();el.hidden=false;
  const t=bj();el.open=AREF.status==='shown'&&D.date===t.date&&t.hm<570;   // 开盘前默认展开，开盘后收起
  $$('#aref tbody tr').forEach(r=>r.onclick=()=>{if(LIST!=='am'){LIST='am';setList()}openDetail(r.dataset.c)})}
// ---------- start ----------
function start(d){D=d;(D.hot&&D.hot.items||[]).forEach(it=>HOT[it.rank]=it);
  const S=D.snapshot||{};Object.keys(S.quotes||{}).forEach(c=>Q[c]=S.quotes[c]);Object.keys(S.klines||{}).forEach(c=>K[c]=parseK(S.klines[c]));['am','pm'].forEach(L=>((D['picks_'+L]||{}).picks||[]).forEach(p=>{const q=Q[p.code]||{};const n=q.f14||q._name;if(n&&badName(p.name))p.displayName=n}));
  QTIME=Math.max(0,...Object.values(S.quotes||{}).map(r=>num(r.f124)||0))||null;
  LIST=D.picks_pm&&D.picks_pm.picks&&D.picks_pm.picks.length?'pm':'am';
  $$('#lbtn button').forEach(b=>{const L=D['picks_'+b.dataset.l];b.disabled=!(L&&L.picks&&L.picks.length);if(b.dataset.l==='pm'&&b.disabled)b.title='12:45 后生成（V3.3 午后名单）';b.onclick=()=>{if(b.disabled)return;LIST=b.dataset.l;setList()}});
  renderAref();$('#formula').innerHTML=formulaHTML();$('#track').innerHTML=trackHTML();$('#disc').textContent=(D.disclaimer||'')+' 名单生成：早盘 '+((D.picks_am||{}).generated_at||'—')+'，午后（12:45 名单） '+((D.picks_pm||{}).generated_at||'未生成')+'；页面构建 '+D.generated_at+'。'+bgText(D.picks_pm);
  setList();schedule()}
function bgText(L){const B=L&&L.background_sources,F=(L&&L.flags)||[];if(!B&&!F.length)return'';
  return ' 午后名单背景数据来源：'+(B?['板块资金流','涨跌停家数','行业涨幅'].map(k=>k+' '+(B[k]||'—')+(k==='行业涨幅'&&B[k]==='新浪'?'（新浪行业分类，与东方财富口径不同）':'')).join('；')+'（只作背景，不进入评分）':'—')+(F.length?'；当日标记：'+F.join('；'):'')+'。'}
function setList(){$$('#lbtn button').forEach(b=>b.classList.toggle('on',b.dataset.l===LIST));const L=D['picks_'+LIST]||{};
  $('#sub').textContent=D.date+' · '+(LIST==='am'?'早盘15支':'午后15支（12:45 名单）');$('#lname').textContent=(LIST==='am'?'早盘':'午后')+'名单 '+(L.picks||[]).length+' 支';
  SEL=null;refresh();layout();kick()}

// ---------- lock / decrypt (same scheme & remembered key as 热点看板) ----------
let ENC=null;const KEYPFX='ashare_dash_key:';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt'])}
const aadOf=E=>new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt);
async function dec(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockUI(m){$('.wrap').hidden=true;$('#lock').hidden=false;$('#lke').textContent=m||''}
function unlocked(d){$('#lock').hidden=true;$('.wrap').hidden=false;if(ENC){$('#lockb').hidden=false;$('#lockb').onclick=()=>{try{localStorage.removeItem(KEYPFX+ENC.salt)}catch(e){}location.reload()}}start(d)}
async function boot(){const emb=JSON.parse($('#embedded').textContent);if(emb.plain){unlocked(emb.plain);return}ENC=emb.enc;
  if(!(window.crypto&&crypto.subtle)){lockUI('当前浏览器不支持页面解密，请用 HTTPS 和新版浏览器打开');return}
  const sk=KEYPFX+ENC.salt;let saved=null;try{saved=localStorage.getItem(sk)}catch(e){}
  if(saved){try{const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);unlocked(await dec(key,ENC));return}catch(e){try{localStorage.removeItem(sk)}catch(_){}lockUI('已记住的密钥已失效，请重新输入')}}else lockUI('');
  $('#lkf').onsubmit=async ev=>{ev.preventDefault();const pw=$('#lkp').value,btn=$('#lkb');if(!pw){$('#lke').textContent='请输入访问密码';return}btn.disabled=true;btn.textContent='解密中…';const rem=$('#lkr').checked;let d=null,key=null;
    try{key=await pwKey(pw,ENC,rem);d=await dec(key,ENC)}catch(e){d=null}
    if(!d){btn.disabled=false;btn.textContent='解锁';$('#lke').textContent='密码错误，请重试';return}
    if(rem){try{localStorage.setItem(sk,b64e(await crypto.subtle.exportKey('raw',key)))}catch(e){}}$('#lkp').value='';unlocked(d)}}
boot();
})();
</script>
