<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061226">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://*.eastmoney.com; connect-src https://*.eastmoney.com https://qt.gtimg.cn; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<title>资金流大脑 · A股15支实时资金</title>
<style>
:root{--bg:#061226;--bg2:#0a1d3a;--card:#0d2347cc;--line:#1d3a66;--ink:#e6f3ff;--dim:#8aa6c8;--sky:#8fd8ff;--sky2:#5cc4ff;--up:#ff5a5f;--down:#2bd47d;--gold:#ffd166;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 700px at 30% -10%,#12366b 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--sky)}
.wrap{max-width:1280px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:13px;color:var(--sky);background:#0b2245}
h1{margin:0;font-size:19px;letter-spacing:.02em;text-shadow:0 0 14px #5cc4ff88}h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.sp{flex:1}
.lbtn{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lbtn button{background:none;border:0;color:var(--dim);padding:5px 11px;font-size:13px;cursor:pointer}.lbtn button.on{background:#1a4a86;color:#fff}.lbtn button:disabled{opacity:.4;cursor:default}
.lockb{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 4px;font-size:12.5px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#0b2245;font-family:var(--mono);font-size:12px}
.pill i{width:8px;height:8px;border-radius:50%;background:#567}.pill.live i{background:var(--sky);box-shadow:0 0 8px var(--sky);animation:bl 1.4s infinite}.pill.warn{border-color:#a07a1f;color:var(--gold)}.pill.warn i{background:var(--gold)}.pill.bad{border-color:#8a2b2b;color:#ff9a9a}.pill.bad i{background:var(--up)}
@keyframes bl{50%{opacity:.35}}
.warnbar{display:none;margin:6px 0;padding:7px 10px;border:1px solid #a07a1f;border-radius:8px;background:#2a2108aa;color:var(--gold);font-size:12.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 1px #0a1a33,0 10px 40px #0008;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}.ph b{color:var(--ink);font-size:14px}
#brainBox{position:relative}
#brain{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px 10px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tip{position:absolute;pointer-events:none;background:#071a36ee;border:1px solid var(--sky2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);display:none;box-shadow:0 0 18px #5cc4ff55}
.counts{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.cnt{flex:1;min-width:84px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#0a1e3d}
.cnt b{display:block;font-family:var(--mono);font-size:18px}.cnt small{color:var(--dim);font-size:11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#0b2245;color:var(--dim);font-weight:500;font-size:11.5px;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid #15305a;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
table.t th:nth-child(2),table.t td:nth-child(2){text-align:left}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover,table.t tbody tr.sel{background:#12345f}
td .nm{font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;color:var(--ink)}td small{display:block;color:var(--dim);font-size:11px}
.u{color:var(--up)}.d{color:var(--down)}.z{color:var(--dim)}
.sc{display:inline-flex;align-items:center;gap:6px}.sc .bar{width:44px;height:6px;border-radius:3px;background:#173462;overflow:hidden}.sc .bar i{display:block;height:100%}
.band{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-family:-apple-system,"PingFang SC",sans-serif}
.b1{background:#ffd16622;color:var(--gold);border:1px solid #ffd16688}.b2{background:#5cc4ff1f;color:var(--sky);border:1px solid #5cc4ff77}.b3{background:#8899aa1f;color:#9fb0c3;border:1px solid #8899aa66}
.why1{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;color:var(--dim);white-space:normal;text-align:left;max-width:260px;margin-top:2px}
.tbl{max-height:640px;overflow:auto}
.formula{margin-top:14px;padding:12px 14px;font-size:13px;color:#c6d9ee}
.formula h3{margin:0 0 6px;font-size:14px;color:var(--ink)}.formula li{margin:3px 0}.formula code{font-family:var(--mono);color:var(--sky);font-size:12px}
.disc{margin-top:10px;font-size:12px;color:var(--dim)}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:#020a18b3;backdrop-filter:blur(3px)}
.sheet.on{display:flex;align-items:center;justify-content:center}
.sbox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0e2a55,#081a36);border:1px solid var(--sky2);border-radius:16px;box-shadow:0 0 40px #5cc4ff44;padding:14px 16px 18px;position:relative}
.sx{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
.sh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-right:30px}.sh h2{margin:0;font-size:20px}.sh .meta{color:var(--dim);font-size:12.5px}
.big{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.kv div{background:#0a1e3d;border:1px solid var(--line);border-radius:8px;padding:5px 7px}.kv small{display:block;color:var(--dim);font-size:11px}.kv b{font-family:var(--mono);font-size:14px}
.verdict{margin:10px 0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0a1e3d;font-size:13.5px}
.parts{margin:6px 0}.pt{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #1b3a66;font-size:12.5px}
.pt .pb{height:7px;background:#173462;border-radius:4px;overflow:hidden}.pt .pb i{display:block;height:100%;background:linear-gradient(90deg,#5cc4ff,#a8e6ff)}
.pt .ev{grid-column:1/-1;color:var(--dim);font-size:12px;margin-top:-2px}.pt .v{font-family:var(--mono);text-align:right}
.ded{color:#ff9a9a;font-size:12.5px;margin:3px 0}
h4{margin:14px 0 6px;font-size:13.5px;color:var(--sky)}
#chart{width:100%;height:200px;display:block;background:#071733;border:1px solid var(--line);border-radius:10px}
.hotl{font-size:12.5px;margin:3px 0;color:#c6d9ee}
/* lock */
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.lk{width:min(360px,92vw);text-align:center;background:#0b2245cc;border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 0 40px #5cc4ff33}
.lk-orb{font-size:46px;filter:drop-shadow(0 0 14px #5cc4ff)}.lk h2{margin:6px 0 2px;font-size:18px}.lk p{margin:0 0 14px;color:var(--dim);font-size:13px}
.lk input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#061226;color:var(--ink);font-size:16px}
.lk button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#2a7fd4,#5cc4ff);color:#fff;font-size:15px;cursor:pointer}
.lk label{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin-top:10px;font-size:13px;color:var(--dim)}
.lke{min-height:20px;margin-top:8px;color:#ff9a9a;font-size:13px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.tbl{max-height:none}.why1{max-width:150px}}
@media (max-width:520px){.wrap{padding-left:8px;padding-right:8px}h1{font-size:17px}h1 small{display:block;margin:0}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}table.t td,table.t th{padding:7px 4px}.hidem{display:none}.pt{grid-template-columns:84px 1fr 52px}}
@media (prefers-reduced-motion:reduce){.pill.live i{animation:none}}
</style>
</head>

    +S.days.slice().reverse().map(r=>'<tr><td>'+esc(r.date)+(r.mode==='backfill'?'<small>回补</small>':'')+'</td><td style="text-align:left">'+esc(r.next)+'</td><td class="'+cls(r.high_avg)+'">'+pct(r.high_avg)+'<small>n='+r.high_n+'</small></td><td class="'+cls(r.low_avg)+'">'+pct(r.low_avg)+'<small>n='+r.low_n+'</small></td><td class="'+cls(r.spread_pp)+'">'+(r.spread_pp==null?'—':sg(r.spread_pp)+r.spread_pp.toFixed(2))+'</td><td class="'+cls(r.all15_net)+'">'+pct(r.all15_net)+'</td></tr>').join('')+'</tbody></table></div>'}
  else h+='<div class="z" style="margin-top:6px">累计跟踪：次一交易日开盘后开始出结果。</div>';
  return h+'<div class="disc">指标1：10:00 冻结价→次一交易日开盘价，高分组(≥75)与低分组(&lt;45)等权平均（涨停买不进/跌停卖不出的剔除）。指标2：全部15支 当日9:30开盘→次日开盘，扣佣金买卖各0.01%、印花税卖出0.05%（悲观再加每边0.2%滑点）。冻结记录写入私有仓库并进入哈希链账本。</div>'}
// ---------- start ----------
function start(d){D=d;(D.hot&&D.hot.items||[]).forEach(it=>HOT[it.rank]=it);
  const S=D.snapshot||{};Object.keys(S.quotes||{}).forEach(c=>Q[c]=S.quotes[c]);Object.keys(S.klines||{}).forEach(c=>K[c]=parseK(S.klines[c]));
  QTIME=Math.max(0,...Object.values(S.quotes||{}).map(r=>num(r.f124)||0))||null;
  LIST=D.picks_pm&&D.picks_pm.picks&&D.picks_pm.picks.length?'pm':'am';
  $$('#lbtn button').forEach(b=>{const L=D['picks_'+b.dataset.l];b.disabled=!(L&&L.picks&&L.picks.length);if(b.dataset.l==='pm'&&b.disabled)b.title='14:45 后生成';b.onclick=()=>{if(b.disabled)return;LIST=b.dataset.l;setList()}});
  $('#formula').innerHTML=formulaHTML();$('#track').innerHTML=trackHTML();$('#disc').textContent=(D.disclaimer||'')+' 名单生成：早盘 '+((D.picks_am||{}).generated_at||'—')+'，午后 '+((D.picks_pm||{}).generated_at||'未生成')+'；页面构建 '+D.generated_at+'。';
  setList();pollQuotes();pollK(true);schedule();scheduleK()}
function setList(){$$('#lbtn button').forEach(b=>b.classList.toggle('on',b.dataset.l===LIST));const L=D['picks_'+LIST]||{};
  $('#sub').textContent=D.date+' · '+(LIST==='am'?'早盘15支':'午后15支');$('#lname').textContent=(LIST==='am'?'早盘':'午后')+'名单 '+(L.picks||[]).length+' 支';
  SEL=null;refresh();layout();kick();if(D)pollK(false).then(()=>pollQuotes())}

// ---------- lock / decrypt (same scheme & remembered key as 热点看板) ----------
let ENC=null;const KEYPFX='ashare_dash_key:';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt'])}
const aadOf=E=>new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt);
async function dec(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockUI(m){$('.wrap').hidden=true;$('#lock').hidden=false;$('#lke').textContent=m||''}
function unlocked(d){$('#lock').hidden=true;$('.wrap').hidden=false;if(ENC){$('#lockb').hidden=false;$('#lockb').onclick=()=>{try{localStorage.removeItem(KEYPFX+ENC.salt)}catch(e){}location.reload()}}start(d)}
async function boot(){const emb=JSON.parse($('#embedded').textContent);if(emb.plain){unlocked(emb.plain);return}ENC=emb.enc;
  if(!(window.crypto&&crypto.subtle)){lockUI('当前浏览器不支持页面解密，请用 HTTPS 和新版浏览器打开');return}
  const sk=KEYPFX+ENC.salt;let saved=null;try{saved=localStorage.getItem(sk)}catch(e){}
  if(saved){try{const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);unlocked(await dec(key,ENC));return}catch(e){try{localStorage.removeItem(sk)}catch(_){}lockUI('已记住的密钥已失效，请重新输入')}}else lockUI('');
  $('#lkf').onsubmit=async ev=>{ev.preventDefault();const pw=$('#lkp').value,btn=$('#lkb');if(!pw){$('#lke').textContent='请输入访问密码';return}btn.disabled=true;btn.textContent='解密中…';const rem=$('#lkr').checked;let d=null,key=null;
    try{key=await pwKey(pw,ENC,rem);d=await dec(key,ENC)}catch(e){d=null}
    if(!d){btn.disabled=false;btn.textContent='解锁';$('#lke').textContent='密码错误，请重试';return}
    if(rem){try{localStorage.setItem(sk,b64e(await crypto.subtle.exportKey('raw',key)))}catch(e){}}$('#lkp').value='';unlocked(d)}}
boot();
})();
</script>
