<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061226">
<meta name="robots" content="noindex,nofollow,noarchive">

<title>资金流大脑 · A股15支实时资金</title>
<style>
:root{--bg:#061226;--bg2:#0a1d3a;--card:#0d2347cc;--line:#1d3a66;--ink:#e6f3ff;--dim:#8aa6c8;--sky:#8fd8ff;--sky2:#5cc4ff;--up:#ff5a5f;--down:#2bd47d;--gold:#ffd166;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 700px at 30% -10%,#12366b 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--sky)}
.wrap{max-width:1280px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:13px;color:var(--sky);background:#0b2245}
h1{margin:0;font-size:19px;letter-spacing:.02em;text-shadow:0 0 14px #5cc4ff88}h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.sp{flex:1}
.lbtn{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lbtn button{background:none;border:0;color:var(--dim);padding:5px 11px;font-size:13px;cursor:pointer}.lbtn button.on{background:#1a4a86;color:#fff}.lbtn button:disabled{opacity:.4;cursor:default}
.lockb{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 4px;font-size:12.5px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#0b2245;font-family:var(--mono);font-size:12px}
.pill i{width:8px;height:8px;border-radius:50%;background:#567}.pill.live i{background:var(--sky);box-shadow:0 0 8px var(--sky);animation:bl 1.4s infinite}.pill.warn{border-color:#a07a1f;color:var(--gold)}.pill.warn i{background:var(--gold)}.pill.bad{border-color:#8a2b2b;color:#ff9a9a}.pill.bad i{background:var(--up)}
@keyframes bl{50%{opacity:.35}}
.warnbar{display:none;margin:6px 0;padding:7px 10px;border:1px solid #a07a1f;border-radius:8px;background:#2a2108aa;color:var(--gold);font-size:12.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 1px #0a1a33,0 10px 40px #0008;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}.ph b{color:var(--ink);font-size:14px}
#brainBox{position:relative}
#brain{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px 10px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tip{position:absolute;pointer-events:none;background:#071a36ee;border:1px solid var(--sky2);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%);display:none;box-shadow:0 0 18px #5cc4ff55}
.counts{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.cnt{flex:1;min-width:84px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#0a1e3d}
.cnt b{display:block;font-family:var(--mono);font-size:18px}.cnt small{color:var(--dim);font-size:11px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:#0b2245;color:var(--dim);font-weight:500;font-size:11.5px;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid #15305a;text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
table.t th:nth-child(2),table.t td:nth-child(2){text-align:left}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover,table.t tbody tr.sel{background:#12345f}
td .nm{font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;color:var(--ink)}td small{display:block;color:var(--dim);font-size:11px}
.u{color:var(--up)}.d{color:var(--down)}.z{color:var(--dim)}
.sc{display:inline-flex;align-items:center;gap:6px}.sc .bar{width:44px;height:6px;border-radius:3px;background:#173462;overflow:hidden}.sc .bar i{display:block;height:100%}
.band{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-family:-apple-system,"PingFang SC",sans-serif}
.b1{background:#ffd16622;color:var(--gold);border:1px solid #ffd16688}.b2{background:#5cc4ff1f;color:var(--sky);border:1px solid #5cc4ff77}.b3{background:#8899aa1f;color:#9fb0c3;border:1px solid #8899aa66}
.why1{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;color:var(--dim);white-space:normal;text-align:left;max-width:260px;margin-top:2px}
.tbl{max-height:640px;overflow:auto}
.formula{margin-top:14px;padding:12px 14px;font-size:13px;color:#c6d9ee}
.formula h3{margin:0 0 6px;font-size:14px;color:var(--ink)}.formula li{margin:3px 0}.formula code{font-family:var(--mono);color:var(--sky);font-size:12px}
.disc{margin-top:10px;font-size:12px;color:var(--dim)}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:#020a18b3;backdrop-filter:blur(3px)}
.sheet.on{display:flex;align-items:center;justify-content:center}
.sbox{width:min(760px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0e2a55,#081a36);border:1px solid var(--sky2);border-radius:16px;box-shadow:0 0 40px #5cc4ff44;padding:14px 16px 18px;position:relative}
.sx{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
.sh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-right:30px}.sh h2{margin:0;font-size:20px}.sh .meta{color:var(--dim);font-size:12.5px}
.big{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.kv div{background:#0a1e3d;border:1px solid var(--line);border-radius:8px;padding:5px 7px}.kv small{display:block;color:var(--dim);font-size:11px}.kv b{font-family:var(--mono);font-size:14px}
.verdict{margin:10px 0;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0a1e3d;font-size:13.5px}
.parts{margin:6px 0}.pt{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #1b3a66;font-size:12.5px}
.pt .pb{height:7px;background:#173462;border-radius:4px;overflow:hidden}.pt .pb i{display:block;height:100%;background:linear-gradient(90deg,#5cc4ff,#a8e6ff)}
.pt .ev{grid-column:1/-1;color:var(--dim);font-size:12px;margin-top:-2px}.pt .v{font-family:var(--mono);text-align:right}
.ded{color:#ff9a9a;font-size:12.5px;margin:3px 0}
h4{margin:14px 0 6px;font-size:13.5px;color:var(--sky)}
#chart{width:100%;height:200px;display:block;background:#071733;border:1px solid var(--line);border-radius:10px}
.hotl{font-size:12.5px;margin:3px 0;color:#c6d9ee}
/* lock */
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.lk{width:min(360px,92vw);text-align:center;background:#0b2245cc;border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 0 40px #5cc4ff33}
.lk-orb{font-size:46px;filter:drop-shadow(0 0 14px #5cc4ff)}.lk h2{margin:6px 0 2px;font-size:18px}.lk p{margin:0 0 14px;color:var(--dim);font-size:13px}
.lk input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#061226;color:var(--ink);font-size:16px}
.lk button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:linear-gradient(90deg,#2a7fd4,#5cc4ff);color:#fff;font-size:15px;cursor:pointer}
.lk label{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin-top:10px;font-size:13px;color:var(--dim)}
.lke{min-height:20px;margin-top:8px;color:#ff9a9a;font-size:13px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.tbl{max-height:none}.why1{max-width:150px}}
@media (max-width:520px){.wrap{padding-left:8px;padding-right:8px}h1{font-size:17px}h1 small{display:block;margin:0}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}table.t td,table.t th{padding:7px 4px}.hidem{display:none}.pt{grid-template-columns:84px 1fr 52px}}
@media (prefers-reduced-motion:reduce){.pill.live i{animation:none}}
</style>
</head>

<script>
(function(){'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===null||v===undefined||v==='-'||v===''||isNaN(+v))?null:+v;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sg=x=>x>0?'+':'';
const amt=x=>x==null?'—':(Math.abs(x)>=1e8?sg(x)+(x/1e8).toFixed(2)+'亿':sg(x)+(x/1e4).toFixed(0)+'万');
const pct=x=>x==null?'—':sg(x)+(+x).toFixed(2)+'%';
const cls=x=>x==null||x==0?'z':x>0?'u':'d';
const EM_HOSTS=['https://82.push2.eastmoney.com','https://push2his.eastmoney.com'];
const QF='f2,f3,f4,f5,f6,f8,f10,f12,f13,f14,f15,f16,f17,f18,f62,f66,f69,f72,f75,f78,f81,f84,f87,f124,f184';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let D=null,LIST='am',Q={},K={},KT={},HOT={},SRC='snapshot',QTIME=null,LASTOK=0,SEL=null,SCORES={},FAILS=0,timer=null,ktimer=null;

// ---------- time ----------
function bj(){const d=new Date(Date.now()+8*3600e3);return{date:d.toISOString().slice(0,10),wd:d.getUTCDay(),hm:d.getUTCHours()*60+d.getUTCMinutes(),ms:Date.now()}}
function session(){const t=bj();if(t.wd<1||t.wd>5)return'closed';if(t.hm>=555&&t.hm<570)return'auction';if(t.hm>=570&&t.hm<=690)return'open';if(t.hm>690&&t.hm<780)return'lunch';if(t.hm>=780&&t.hm<=900)return'open';return'closed'}
const SESS={auction:'集合竞价',open:'交易中',lunch:'午间休市',closed:'非交易时段'};
function fmtTs(s){if(!s)return'—';const d=new Date(s*1000+8*3600e3);return d.toISOString().slice(5,10)+' '+d.toISOString().slice(11,19)}
function tsDate(s){return s?new Date(s*1000+8*3600e3).toISOString().slice(0,10):null}

// ---------- network ----------
let JN=0;
function jsonp(url){return new Promise((res,rej)=>{const cb='__bcb'+Date.now().toString(36)+(++JN);const s=document.createElement('script');
  const to=setTimeout(()=>{done();rej(new Error('timeout'))},8000);function done(){clearTimeout(to);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}
  window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej(new Error('jsonp error'))};s.src=url+(url.indexOf('?')>=0?'&':'?')+'cb='+cb;document.head.appendChild(s)})}
async function getJSON(url){try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),7000);const r=await fetch(url,{cache:'no-store',signal:ac.signal});clearTimeout(to);const t=await r.text();if(!t)throw 0;return JSON.parse(t)}catch(e){return jsonp(url)}}
async function em(path){let last;for(const h of EM_HOSTS){try{const d=await getJSON(h+path+(path.indexOf('?')>=0?'&':'?')+'_='+Date.now());if(d&&d.data)return d.data;last=new Error('empty')}catch(e){last=e}}throw last}
const secid=p=>((p.exchange||'').toUpperCase()==='SH'?'1.':'0.')+p.code;
const txid=p=>((p.exchange||'').toUpperCase()==='SH'?'sh':(p.exchange||'').toUpperCase()==='BJ'?'bj':'sz')+p.code;
async function tencent(P){const r=await fetch('https://qt.gtimg.cn/q='+P.map(txid).join(',')+'&_='+Date.now(),{cache:'no-store'});const buf=await r.arrayBuffer();
  let t;try{t=new TextDecoder('gbk').decode(buf)}catch(e){t=new TextDecoder().decode(buf)}let n=0,ts=null;
  t.split(';').forEach(line=>{const m=line.match(/v_[a-z]{2}(\d{6})="([^"]*)"/);if(!m)return;const f=m[2].split('~');if(f.length<40)return;
    const q=Q[m[1]]=Object.assign({},Q[m[1]]||{});q.f2=num(f[3]);q.f18=num(f[4]);q.f17=num(f[5]);q.f3=num(f[32]);q.f15=num(f[33]);q.f16=num(f[34]);q.f8=num(f[38]);q.f6=num(f[37])!=null?num(f[37])*1e4:q.f6;q._tx=1;n++;
    const s=f[30];if(/^\d{14}$/.test(s)){const u=Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10)-8,+s.slice(10,12),+s.slice(12,14))/1000;ts=Math.max(ts||0,u)}});
  if(!n)throw new Error('tencent empty');return ts}
function parseK(rows){return(rows||[]).map(r=>{const a=String(r).split(',');return{t:a[0].slice(11,16),main:+a[1],small:+a[2],mid:+a[3],big:+a[4],xl:+a[5]}}).filter(r=>isFinite(r.main))}

async function pollQuotes(){const P=picks();if(!P.length)return;
  try{const d=await em('/api/qt/ulist.np/get?fltt=2&invt=2&fields='+QF+'&secids='+P.map(secid).join(','));let ts=0;
    (d.diff||[]).forEach(r=>{Q[r.f12]=r;ts=Math.max(ts,num(r.f124)||0)});SRC='em';QTIME=ts||QTIME;LASTOK=Date.now();FAILS=0}
  catch(e){FAILS++;try{const ts=await tencent(P);SRC='tx';QTIME=ts||QTIME;LASTOK=Date.now()}catch(e2){SRC=SRC==='snapshot'?'snapshot':'fail'}}
  refresh()}
async function pollK(force){const P=picks();let i=0;
  async function worker(){while(i<P.length){const p=P[i++];if(!force&&KT[p.code]&&Date.now()-KT[p.code]<50000)continue;
    try{const d=await em('/api/qt/stock/fflow/kline/get?lmt=0&klt=1&secid='+secid(p)+'&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57');K[p.code]=parseK(d.klines);KT[p.code]=Date.now()}catch(e){}}}
  await Promise.all([worker(),worker(),worker()]);refresh()}
function schedule(){clearTimeout(timer);const s=session();const iv=(s==='open'||s==='auction')?6000:s==='lunch'?60000:300000;
  timer=setTimeout(async()=>{if(!document.hidden)await pollQuotes();schedule()},iv)}
function scheduleK(){clearTimeout(ktimer);const s=session();ktimer=setTimeout(async()=>{if(!document.hidden&&(s==='open'))await pollK(false);scheduleK()},s==='open'?60000:300000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D){pollQuotes();schedule()}});

// ---------- scoring (transparent, rules-based) ----------
function limitPct(p){const c=String(p.code);if(/ST/i.test(p.name||''))return 5;if(/^(300|301|688|689)/.test(c))return 20;if(/^[48]/.test(c))return 30;return 10}
function rel(item,p){const hit=a=>(a||[]).some(x=>{x=String(x);return x.indexOf(p.name)>=0||(p.sector&&(x.indexOf(p.sector)>=0||p.sector.indexOf(x.replace(/[（(].*$/,''))>=0&&x.length>=2))});
  if(hit(item.bull))return[1,'利好'];if(hit(item.bear))return[0,'利空'];if(item.sentiment==='bull')return[1,'利好'];if(item.sentiment==='bear')return[.2,'利空'];return[.6,'多空交织']}
function scoreOf(p){const q=Q[p.code]||{},k=K[p.code];const parts=[],deds=[];
  const f184=num(q.f184),f62=num(q.f62),f3=num(q.f3),f8=num(q.f8),price=num(q.f2),open=num(q.f17),noFlow=q._tx&&f62==null;
  // A 主力净占比 25
  const A=f184==null?12.5:clamp((f184+10)/20,0,1)*25;
  parts.push({l:'主力净占比',max:25,pts:A,ev:f184==null?'暂无数据，按中性 12.5 分':'主力净流入占成交额 '+pct(f184)+'（-10%→0分，0→12.5分，+10%及以上→满分）'});
  // B 主力净流入规模 15
  let B=7.5;if(f62!=null){const s=Math.sign(f62)*Math.min(1,Math.log10(1+Math.abs(f62)/1e6)/Math.log10(301));B=7.5*(1+s)}
  const sub=[num(q.f66)!=null?'超大单 '+amt(num(q.f66)):'',num(q.f72)!=null?'大单 '+amt(num(q.f72)):'',num(q.f84)!=null?'小单 '+amt(num(q.f84)):''].filter(Boolean).join('，');
  parts.push({l:'主力净流入额',max:15,pts:B,ev:f62==null?'暂无数据，按中性 7.5 分':'主力净流入 '+amt(f62)+(sub?'（'+sub+'）':'')+'；对数刻度，±3亿封顶'});
  // C 资金趋势 15
  let C=7.5,cev='暂无分钟资金数据，按中性 7.5 分';
  if(k&&k.length>=2){const n=Math.min(15,k.length-1),L=k.length-1;const delta=k[L].main-k[L-n].main;let abs=0;for(let i=L-n+1;i<=L;i++)abs+=Math.abs(k[i].main-k[i-1].main);
    const r=abs?delta/abs:0;C=7.5*(1+r);cev='近'+n+'分钟主力净流入 '+amt(delta)+'，方向一致度 '+(r*100).toFixed(0)+'%（持续流入→满分，持续流出→0）'}
  parts.push({l:'资金趋势',max:15,pts:C,ev:cev});
  // D 涨跌与换手 15
  const dc=f3==null?5:clamp((f3+5)/10,0,1)*10;const dt=f8==null?2.5:(f8>=2&&f8<=15?5:(f8>=1&&f8<=25?3:1));
  parts.push({l:'涨跌与换手',max:15,pts:dc+dt,ev:'涨跌 '+pct(f3)+'（-5%→0，+5%→10分）；换手率 '+(f8==null?'—':f8.toFixed(2)+'%')+'（2–15%得5分，1–25%得3分，其余1分）'});
  // E 热点关联 20
  const links=(p.hotspot_ranks||[]).map(r=>HOT[r]).filter(Boolean);let E=0,eev='未关联热点看板条目';
  if(links.length){const vals=links.map(it=>{const[w,lab]=rel(it,p);return{v:(+it.score||0)*.15*w,it,lab}}).sort((a,b)=>b.v-a.v);
    E=Math.min(20,vals[0].v+2.5*Math.min(2,links.length-1));eev=vals.map(x=>'热点#'+x.it.rank+'「'+x.it.title.slice(0,26)+(x.it.title.length>26?'…':'')+'」'+x.it.score+'分·'+x.lab).join('；')+'（最高关联分×0.15，多条关联每条+2.5，上限20）'}
  parts.push({l:'热点关联',max:20,pts:E,ev:eev});

function qp(e,t){const u=1-t;return[u*u*e.a.x+2*u*t*e.cx+t*t*e.b.x,u*u*e.a.y+2*u*t*e.cy+t*t*e.b.y]}
function nodeR(n){const f=num((Q[n.p.code]||{}).f62);const mx=Math.max(1,...nodes.map(m=>Math.abs(num((Q[m.p.code]||{}).f62)||0)));const s=W<520?.62:1;return(7+14*Math.sqrt(Math.abs(f||0)/mx))*s}
function draw(t){if(!base)return;const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.drawImage(base,0,0,W,H);
  const hub=nodes.hub;if(!hub)return;
  // synapses
  edges.forEach(e=>{ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.quadraticCurveTo(e.cx,e.cy,e.b.x,e.b.y);
    if(e.hub){const f=num((Q[e.n.p.code]||{}).f62);ctx.strokeStyle=f==null?'rgba(143,216,255,.25)':f>=0?'rgba(255,90,95,.35)':'rgba(43,212,125,.35)';ctx.lineWidth=1.3;ctx.setLineDash([])}
    else{ctx.strokeStyle=e.sector?'rgba(255,209,102,.45)':'rgba(170,228,255,.35)';ctx.lineWidth=e.sector?1.2:1;ctx.setLineDash(e.sector?[4,4]:[])}ctx.stroke()});ctx.setLineDash([]);
  // spawn pulses
  if(!RM)edges.forEach(e=>{if(e.hub){const q=Q[e.n.p.code]||{},f=num(q.f62),r=num(q.f184);if(f==null)return;const rate=.35+2.6*Math.min(1,Math.abs(r||0)/10);if(Math.random()<rate*dt)pulses.push({e,t:0,dir:f>=0?1:-1,col:f>=0?'255,90,95':'43,212,125',sp:.55+Math.min(1,Math.abs(r||0)/10)*.6})}
    else if(Math.random()<.18*dt)pulses.push({e,t:0,dir:Math.random()<.5?1:-1,col:'190,235,255',sp:.4})});
  pulses=pulses.filter(p=>{p.t+=dt*p.sp;if(p.t>=1)return false;const tt=p.dir>0?p.t:1-p.t;for(let k=0;k<4;k++){const tk=clamp(tt-p.dir*k*.03,0,1);const[x,y]=qp(p.e,tk);ctx.fillStyle='rgba('+p.col+','+(.9-k*.22)+')';ctx.beginPath();ctx.arc(x,y,(2.6-k*.5),0,7);ctx.fill()}return true});
  // hub
  const hp=.5+.5*Math.sin(t/600);ctx.save();ctx.shadowColor='#8fd8ff';ctx.shadowBlur=18+hp*10;ctx.fillStyle='#bfe9ff';ctx.beginPath();ctx.arc(hub.x,hub.y,W<520?6:8,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='#cfefff';ctx.font=(W<520?10:11)+'px sans-serif';ctx.textAlign='center';ctx.fillText('主力资金',hub.x,hub.y+(W<520?17:20));
  // nodes
  nodes.forEach(n=>{const q=Q[n.p.code]||{},f=num(q.f62),r=num(q.f184),s=SCORES[n.p.code]||scoreOf(n.p),R=nodeR(n);const col=f==null?'150,170,190':f>=0?'255,90,95':'43,212,125';
    const sp=.002+.006*Math.min(1,Math.abs(r||0)/10);const pu=RM?.5:.5+.5*Math.sin(t*sp+n.ph);
    const halo=ctx.createRadialGradient(n.x,n.y,R*.4,n.x,n.y,R*(2.1+pu*.9));halo.addColorStop(0,'rgba('+col+',.55)');halo.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(n.x,n.y,R*(2.1+pu*.9),0,7);ctx.fill();
    ctx.fillStyle='rgba('+col+',.95)';ctx.beginPath();ctx.arc(n.x,n.y,R,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(n.x-R*.3,n.y-R*.3,R*.35,0,7);ctx.fill();
    const bc=BAND[s.band][2];ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(n.x,n.y,R+4,0,7);ctx.stroke();
    ctx.strokeStyle=bc;ctx.lineWidth=3;ctx.beginPath();ctx.arc(n.x,n.y,R+4,-Math.PI/2,-Math.PI/2+Math.PI*2*s.total/100);ctx.stroke();
    if(SEL===n.p.code||hover===n){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(n.x,n.y,R+8,0,7);ctx.stroke()}
    const small=W<520;ctx.textAlign='center';ctx.font='600 '+(small?10:12)+'px -apple-system,"PingFang SC",sans-serif';ctx.fillStyle='#f2fbff';ctx.shadowColor='#000';ctx.shadowBlur=4;
    ctx.fillText(n.p.name+' '+s.total,n.x,n.y+R+(small?15:17));ctx.font=(small?9:10.5)+'px '+getComputedStyle(document.body).getPropertyValue('--mono');ctx.fillStyle=f==null?'#9fb0c3':f>=0?'#ff9da0':'#7ff0b0';
    ctx.fillText(amt(f)+(small?'':' '+pct(r)),n.x,n.y+R+(small?26:31));ctx.shadowBlur=0});
  if(visible&&!document.hidden)anim=requestAnimationFrame(draw);else anim=null}
function kick(){if(!anim&&visible&&!document.hidden){lastT=performance.now();anim=requestAnimationFrame(draw)}}
new IntersectionObserver(es=>{visible=es[0].isIntersecting;kick()}).observe(cv);document.addEventListener('visibilitychange',kick);
function hit(ev){const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;let best=null,bd=1e9;nodes.forEach(n=>{const d=Math.hypot(n.x-x,n.y-y);if(d<nodeR(n)+16&&d<bd){bd=d;best=n}});return best}
cv.addEventListener('click',ev=>{const n=hit(ev);if(n)openDetail(n.p.code)});
cv.addEventListener('mousemove',ev=>{const n=hit(ev),tip=$('#tip');hover=n;cv.style.cursor=n?'pointer':'default';if(!n){tip.style.display='none';return}const q=Q[n.p.code]||{},s=SCORES[n.p.code];
  tip.innerHTML='<b>'+esc(n.p.name)+'</b> '+esc(n.p.code)+'<br>主力 <span class="'+cls(num(q.f62))+'">'+amt(num(q.f62))+'</span> · 占比 '+pct(num(q.f184))+'<br>评分 '+s.total+' · '+BAND[s.band][0];tip.style.left=n.x+'px';tip.style.top=(n.y-nodeR(n))+'px';tip.style.display='block';if(RM)draw(performance.now())});
cv.addEventListener('mouseleave',()=>{hover=null;$('#tip').style.display='none'});
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{layout();kick()},150)});

// ---------- formula text ----------
function formulaHTML(){return'<h3>评分公式（满分100，浏览器内按实时数据重算，全部规则公开）</h3><ol>'
 +'<li><b>主力净占比 25分</b>：<code>clamp((净占比%+10)/20,0,1)×25</code>，-10%→0、0→12.5、+10%以上→25。</li>'
 +'<li><b>主力净流入额 15分</b>：<code>7.5×(1+sign·min(1,log10(1+|额|/100万)/log10(301)))</code>，±3亿封顶。</li>'
 +'<li><b>资金趋势 15分</b>：近15分钟主力累计净流入变化 ÷ 同期每分钟变化绝对值之和 = 方向一致度 r，<code>7.5×(1+r)</code>。</li>'
 +'<li><b>涨跌与换手 15分</b>：涨跌 <code>clamp((涨跌%+5)/10,0,1)×10</code>；换手 2–15% 得5、1–25% 得3、其余1。</li>'
 +'<li><b>热点关联 20分</b>：名单里关联的热点看板条目，<code>最高热点总分×0.15×方向系数</code>（利好1、多空0.6、利空0~0.2），多条关联每条+2.5，上限20。</li>'
 +'<li><b>竞价强度 10分</b>：竞价涨幅 <code>clamp((涨幅%+3)/9,0,1)×8</code>，竞价额≥5000万+2、≥1000万+1；午后名单无竞价数据按5分。</li>'
 +'<li><b>风险扣分</b>：涨停/逼近涨停 −8（难成交、追高）；跌停 −10；较开盘回落≥3% −6；股价涨≥2%但主力净流出 −4；跌幅≥3% −4；ST −10。</li></ol>'
 +'<div><b>建议档位</b>：<span class="band b1">≥75 推荐建仓</span>（含75）　<span class="band b2">45–74 观察</span>　<span class="band b3">&lt;45 不推荐</span></div>'
 +'<div class="disc">数据：东方财富 push2（主力=超大单+大单）每6秒刷新，失败时自动改用 JSONP，再失败改用腾讯行情（只有价格）；分钟资金流每分钟更新。缺失项按中性分计并在明细里注明。</div>'}

// ---------- start ----------
function start(d){D=d;(D.hot&&D.hot.items||[]).forEach(it=>HOT[it.rank]=it);
  const S=D.snapshot||{};Object.keys(S.quotes||{}).forEach(c=>Q[c]=S.quotes[c]);Object.keys(S.klines||{}).forEach(c=>K[c]=parseK(S.klines[c]));
  QTIME=Math.max(0,...Object.values(S.quotes||{}).map(r=>num(r.f124)||0))||null;
  LIST=D.picks_pm&&D.picks_pm.picks&&D.picks_pm.picks.length?'pm':'am';
  $$('#lbtn button').forEach(b=>{const L=D['picks_'+b.dataset.l];b.disabled=!(L&&L.picks&&L.picks.length);if(b.dataset.l==='pm'&&b.disabled)b.title='14:45 后生成';b.onclick=()=>{if(b.disabled)return;LIST=b.dataset.l;setList()}});
  $('#formula').innerHTML=formulaHTML();$('#disc').textContent=(D.disclaimer||'')+' 名单生成：早盘 '+((D.picks_am||{}).generated_at||'—')+'，午后 '+((D.picks_pm||{}).generated_at||'未生成')+'；页面构建 '+D.generated_at+'。';
  setList();pollQuotes();pollK(true);schedule();scheduleK()}
function setList(){$$('#lbtn button').forEach(b=>b.classList.toggle('on',b.dataset.l===LIST));const L=D['picks_'+LIST]||{};
  $('#sub').textContent=D.date+' · '+(LIST==='am'?'早盘15支':'午后15支');$('#lname').textContent=(LIST==='am'?'早盘':'午后')+'名单 '+(L.picks||[]).length+' 支';
  SEL=null;refresh();layout();kick();if(D)pollK(false).then(()=>pollQuotes())}

// ---------- lock / decrypt (same scheme & remembered key as 热点看板) ----------
let ENC=null;const KEYPFX='ashare_dash_key:';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
async function pwKey(pw,E,ext){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},ext,['decrypt'])}
const aadOf=E=>new TextEncoder().encode(E.v+'|'+E.alg+'|'+E.kdf+'|'+E.iter+'|'+E.salt);
async function dec(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv),additionalData:aadOf(E)},key,b64d(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function lockUI(m){$('.wrap').hidden=true;$('#lock').hidden=false;$('#lke').textContent=m||''}
function unlocked(d){$('#lock').hidden=true;$('.wrap').hidden=false;if(ENC){$('#lockb').hidden=false;$('#lockb').onclick=()=>{try{localStorage.removeItem(KEYPFX+ENC.salt)}catch(e){}location.reload()}}start(d)}
async function boot(){const emb=JSON.parse($('#embedded').textContent);if(emb.plain){unlocked(emb.plain);return}ENC=emb.enc;
  if(!(window.crypto&&crypto.subtle)){lockUI('当前浏览器不支持页面解密，请用 HTTPS 和新版浏览器打开');return}
  const sk=KEYPFX+ENC.salt;let saved=null;try{saved=localStorage.getItem(sk)}catch(e){}
  if(saved){try{const key=await crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},false,['decrypt']);unlocked(await dec(key,ENC));return}catch(e){try{localStorage.removeItem(sk)}catch(_){}lockUI('已记住的密钥已失效，请重新输入')}}else lockUI('');
  $('#lkf').onsubmit=async ev=>{ev.preventDefault();const pw=$('#lkp').value,btn=$('#lkb');if(!pw){$('#lke').textContent='请输入访问密码';return}btn.disabled=true;btn.textContent='解密中…';const rem=$('#lkr').checked;let d=null,key=null;
    try{key=await pwKey(pw,ENC,rem);d=await dec(key,ENC)}catch(e){d=null}
    if(!d){btn.disabled=false;btn.textContent='解锁';$('#lke').textContent='密码错误，请重试';return}
    if(rem){try{localStorage.setItem(sk,b64e(await crypto.subtle.exportKey('raw',key)))}catch(e){}}$('#lkp').value='';unlocked(d)}}
boot();
})();
